, entró él en una aldea: y una mujer llamada Marta, le recibió en su casa."], [39, "Y ésta tenía una hermana que se llamaba María, la cual sentándose á los pies de Jesús, oía su palabra."], [40, "Empero Marta se distraía en muchos servicios; y sobreviniendo, dice: Señor, ¿no tienes cuidado que mi hermana me deja servir sola? Dile pues, que me ayude."], [41, "Pero respondiendo Jesús, le dijo: Marta, Marta, cuidadosa estás, y con las muchas cosas estás turbada:"], [42, "Empero una cosa es necesaria; y María escogió la buena parte, la cual no le será quitada."]], "meaning": "Jesús le respondió con ternura, llamándola dos veces por su nombre. Vio lo afanada y turbada que estaba por muchas cosas. Solo una cosa era necesaria, dijo, y María la había escogido: estar con Él. El servicio de Marta importaba, pero Jesús quería su corazón más que su ajetreo.", "good": "Nuestras buenas obras fluyen mejor del tiempo que pasamos con Dios, no de la preocupación. Cuando primero descansamos en Su presencia, servimos a otros con paz y no con resentimiento. El tiempo con Jesús nunca es tiempo perdido.", "carry": "Antes de hacer más, siéntate un momento con Jesús.", "prayer": "Señor, calma mi corazón afanado. Enséñame a escoger la buena parte."}}, {"id": "bartimaeus", "theme": "hope", "en": {"title": "Blind Bartimaeus", "ref": "Mark 10:46–52", "spoken": "Mark, chapter 10, verses 46 through 52", "story": "A blind man named Bartimaeus sat begging by the road outside Jericho. When he heard that Jesus was passing by, he began shouting for mercy. The crowd told him to be quiet, but he shouted even louder.", "passage": [[46, "And they came to Jericho: and as he went out of Jericho with his disciples and a great number of people, blind Bartimeus, the son of Timeus, sat by the highway side begging."], [47, "And when he heard that it was Jesus of Nazareth, he began to cry out, and say, Jesus, thou Son of David, have mercy on me."], [48, "And many charged him that he should hold his peace: but he cried the more a great deal, Thou Son of David, have mercy on me."], [49, "And Jesus stood still, and commanded him to be called. And they call the blind man, saying unto him, Be of good comfort, rise; he calleth thee."], [50, "And he, casting away his garment, rose, and came to Jesus."], [51, "And Jesus answered and said unto him, What wilt thou that I should do unto thee? The blind man said unto him, Lord, that I might receive my sight."], [52, "And Jesus said unto him, Go thy way; thy faith hath made thee whole. And immediately he received his sight, and followed Jesus in the way."]], "meaning": "Jesus stopped and called for him. Bartimaeus threw off his cloak, jumped up, and came. Jesus asked a simple question: What do you want me to do for you? He asked to see, and he was healed at once, and he followed Jesus down the road.", "good": "The crowd tried to silence someone in need, but Jesus stopped for him. We can choose to be like Jesus in that moment, noticing and listening instead of hushing. And we can come to God boldly, as Bartimaeus did, trusting that He cares what we ask.", "carry": "Don’t let anyone quiet your prayer. Jesus stops for you.", "prayer": "Jesus, have mercy on me. Open my eyes to see You, and to see others."}, "es": {"title": "El ciego Bartimeo", "ref": "Marcos 10:46–52", "spoken": "Marcos, capítulo 10, versículos 46 al 52", "story": "Un ciego llamado Bartimeo estaba sentado junto al camino, a la salida de Jericó, pidiendo limosna. Cuando oyó que Jesús pasaba, comenzó a gritar pidiendo misericordia. La gente le decía que se callara, pero él gritaba aún más fuerte.", "passage": [[46, "Entonces vienen á Jericó: y saliendo él de Jericó y sus discípulos y una gran compañía, Bartimeo el ciego, hijo de Timeo, estaba sentado junto al camino mendigando."], [47, "Y oyendo que era Jesús el Nazareno, comenzó á dar voces y decir: Jesús, Hijo de David, ten misericordia de mí."], [48, "Y muchos le reñían, que callase: mas él daba mayores voces: Hijo de David, ten misericordia de mí."], [49, "Entonces Jesús parándose, mandó llamarle: y llaman al ciego, diciéndole: Ten confianza: levántate, te llama."], [50, "El entonces, echando su capa, se levantó, y vino á Jesús."], [51, "Y respondiendo Jesús, le dice: ¿Qué quieres que te haga? Y el ciego le dice: Maestro, que cobre la vista."], [52, "Y Jesús le dijo: Ve, tu fe te ha salvado. Y luego cobró la vista, y seguía á Jesús en el camino."]], "meaning": "Jesús se detuvo y lo mandó llamar. Bartimeo arrojó su capa, se levantó de un salto y fue. Jesús le hizo una pregunta sencilla: ¿Qué quieres que te haga? Él pidió ver, y fue sanado al instante, y siguió a Jesús por el camino.", "good": "La multitud quiso callar a alguien necesitado, pero Jesús se detuvo por él. Podemos escoger ser como Jesús en ese momento: notar y escuchar en lugar de acallar. Y podemos acercarnos a Dios con valentía, como Bartimeo, confiando en que le importa lo que le pedimos.", "carry": "No dejes que nadie calle tu oración. Jesús se detiene por ti.", "prayer": "Jesús, ten misericordia de mí. Abre mis ojos para verte a Ti y para ver a los demás."}}, {"id": "lazarus", "theme": "hope", "en": {"title": "Jesus Wept", "ref": "John 11:33–35, 43–44", "spoken": "John, chapter 11", "story": "Jesus’ dear friend Lazarus had died and had been in the tomb for four days. When Jesus arrived, Lazarus’s sister Mary fell at His feet weeping, and the friends with her were weeping too.", "passage": [[33, "When Jesus therefore saw her weeping, and the Jews also weeping which came with her, he groaned in the spirit, and was troubled,"], [34, "And said, Where have ye laid him? They said unto him, Lord, come and see."], [35, "Jesus wept."], [43, "And when he thus had spoken, he cried with a loud voice, Lazarus, come forth."], [44, "And he that was dead came forth, bound hand and foot with graveclothes: and his face was bound about with a napkin. Jesus saith unto them, Loose him, and let him go."]], "meaning": "Jesus knew He was about to raise Lazarus, yet He was deeply moved and wept with them. God does not stand far from our grief. He enters it. Then Jesus called out with a loud voice, Lazarus, come forth, and the man who had died walked out of the tomb.", "good": "Because Jesus wept with His friends, we can sit with people in their sorrow instead of rushing past it. Showing up for someone who is grieving is a holy kind of goodness. And we grieve with hope, because Jesus has power even over death.", "carry": "Jesus weeps with you, and He still has the last word.", "prayer": "Lord, thank You for sharing my sorrow. Fill me with a hope that is stronger than death."}, "es": {"title": "Jesús lloró", "ref": "Juan 11:33–35, 43–44", "spoken": "Juan, capítulo 11", "story": "Lázaro, amigo querido de Jesús, había muerto y llevaba cuatro días en el sepulcro. Cuando Jesús llegó, María, la hermana de Lázaro, cayó a sus pies llorando, y los amigos que la acompañaban también lloraban.", "passage": [[33, "Jesús entonces, como la vió llorando, y á los Judíos que habían venido juntamente con ella llorando, se conmovió en espíritu, y turbóse,"], [34, "Y dijo: ¿Dónde le pusisteis? Dícenle: Señor, ven, y ve."], [35, "Y lloró Jesús."], [43, "Y habiendo dicho estas cosas, clamó á gran voz: Lázaro, ven fuera."], [44, "Y el que había estado muerto, salió, atadas las manos y los pies con vendas; y su rostro estaba envuelto en un sudario. Díceles Jesús: Desatadle, y dejadle ir."]], "meaning": "Jesús sabía que estaba a punto de resucitar a Lázaro, y aun así se conmovió profundamente y lloró con ellos. Dios no se queda lejos de nuestro dolor. Entra en él. Luego Jesús clamó a gran voz: Lázaro, ven fuera, y el hombre que había muerto salió del sepulcro.", "good": "Porque Jesús lloró con sus amigos, podemos acompañar a otros en su tristeza en vez de pasar de largo. Estar presente para alguien que está de luto es una bondad sagrada. Y lloramos con esperanza, porque Jesús tiene poder aun sobre la muerte.", "carry": "Jesús llora contigo, y Él todavía tiene la última palabra.", "prayer": "Señor, gracias por compartir mi tristeza. Lléname de una esperanza más fuerte que la muerte."}}, {"id": "roof", "theme": "kindness", "en": {"title": "Friends Through the Roof", "ref": "Mark 2:3–5, 11–12", "spoken": "Mark, chapter 2", "story": "A man who could not walk had four friends who believed Jesus could help him. They carried him to the house where Jesus was teaching, but the crowd was so thick they could not get in. So they climbed onto the roof, opened it up, and lowered him down.", "passage": [[3, "And they come unto him, bringing one sick of the palsy, which was borne of four."], [4, "And when they could not come nigh unto him for the press, they uncovered the roof where he was: and when they had broken it up, they let down the bed wherein the sick of the palsy lay."], [5, "When Jesus saw their faith, he said unto the sick of the palsy, Son, thy sins be forgiven thee."], [11, "I say unto thee, Arise, and take up thy bed, and go thy way into thine house."], [12, "And immediately he arose, took up the bed, and went forth before them all; insomuch that they were all amazed, and glorified God, saying, We never saw it on this fashion."]], "meaning": "Jesus saw their faith, the faith of the friends, and spoke first to the man’s heart: your sins are forgiven. Then He told him to get up, take his mat, and go home. The man stood up and walked out in front of everyone, and they all praised God.", "good": "Sometimes the best good we can do is carry someone to Jesus: praying for them, showing up, and refusing to give up when the way is blocked. Our faith can make a difference in someone else’s story.", "carry": "Be the kind of friend who carries others to Jesus.", "prayer": "Lord, show me who I can carry to You in prayer today."}, "es": {"title": "Amigos por el techo", "ref": "Marcos 2:3–5, 11–12", "spoken": "Marcos, capítulo 2", "story": "Un hombre que no podía caminar tenía cuatro amigos que creían que  [42, "And he said unto Jesus, Lord, remember me when thou comest into thy kingdom."], [43, "And Jesus said unto him, Verily I say unto thee, To day shalt thou be with me in paradise."]], "meaning": "His first words were a prayer for the very people hurting Him: Father, forgive them, for they know not what they do. Later, one of the criminals beside Him asked to be remembered. Jesus promised him: today you will be with me in paradise. No one is beyond His mercy, even at the very end.", "good": "If Jesus could forgive from the cross, His love can help us forgive the people who have hurt us. Forgiveness sets our own hearts free. And His promise to the criminal reminds us that it is never too late to turn to God.", "carry": "It is never too late to receive God’s mercy, or to share it.", "prayer": "Jesus, thank You for forgiving me. Help me forgive as You forgave."}, "es": {"title": "Padre, perdónalos", "ref": "Lucas 23:33–34, 42–43", "spoken": "Lucas, capítulo 23", "story": "Jesús fue clavado en una cruz entre dos malhechores. Los soldados se burlaban de Él y la multitud lo insultaba. En ese momento de mayor dolor, Él habló.", "passage": [[33, "Y como vinieron al lugar que se llama de la Calavera, le crucificaron allí, y á los malhechores, uno á la derecha, y otro á la izquierda."], [34, "Y Jesús decía: Padre, perdónalos, porque no saben lo que hacen. Y partiendo sus vestidos, echaron suertes."], [42, "Y dijo á Jesús: Acuérdate de mí cuando vinieres á tu reino."], [43, "Entonces Jesús le dijo: De cierto te digo, que hoy estarás conmigo en el paraíso."]], "meaning": "Sus primeras palabras fueron una oración por quienes lo estaban lastimando: Padre, perdónalos, porque no saben lo que hacen. Más tarde, uno de los malhechores a su lado le pidió que se acordara de él. Jesús le prometió: hoy estarás conmigo en el paraíso. Nadie está fuera del alcance de Su misericordia, ni siquiera al final.", "good": "Si Jesús pudo perdonar desde la cruz, Su amor puede ayudarnos a perdonar /* The exact list of spoken pieces for a story, in reading order (used by the app and by make-voices.mjs). */
function segmentTexts(story, lang){
  const s = story[lang], sec = UI[lang].sec, out = [s.title + ". " + s.spoken + "."];
  const add = t => sentences(t).forEach(x => out.push(x.trim()));
  out.push(sec[0]); add(s.story);
  out.push(sec[1]); s.passage.forEach(([n, t]) => add(t));
  out.push(sec[2]); add(s.meaning);
  out.push(sec[3]); add(s.good);
  out.push(sec[4]); add(s.carry);
  out.push(sec[5]); add(s.prayer);
  return out;
}

  stopReading(); currentId = null;
  const t = STORIES[todayIndex()], tx = T();
  const items = STORIES.filter(s => filter === "all" || (filter === "saved" ? saved.has(s.id) : s.theme === filter));
  const chip = (key, label) => `<button data-filter="${key}" aria-pressed="${filter===key}">${esc(label)}</button>`;
  $("#app").innerHTML = `
    <div class="topline"><a class="jlink" href="https://japps.ai"${ext}>${tx.backJapps}</a>${toolBtns()}</div>
    <div class="brand">${lamp}<b>Lamp</b><span>${tx.sub}</span></div>
    <section class="today" aria-labelledby="today-h">
      <small>${tx.today}</small>
      <h1 id="today-h">${esc(L(t).title)}</h1>
      <p>${esc(L(t).carry)}</p>
      <button class="primary" data-open="${t.id}" data-autoplay="1">${icons.play} ${tx.listen}</button>
    </section>
    <div class="listhead"><h2>${tx.all}</h2><span>${tx.count(items.length)}</span></div>
    <div class="chips" role="group" aria-label="${tx.all}">
      ${chip("all", tx.chipAll)}${chip("saved", "♥ " + tx.chipSaved)}${THEMES.map(k => chip(k, tx.themes[k])).join("")}
    </div>
    ${items.length ? `<ul class="list">${items.map(s => `
      <li><button data-open="${s.id}">
        <span class="t">${esc(L(s).title)}${saved.has(s.id) ? " ♥" : ""}</span>
        <span class="theme">${esc(tx.themes[s.theme])}</span>
        <span class="m">${esc(L(s).ref)}</span>
      </button></li>`).join("")}</ul>`
      : `<p class="empty">${tx.empty}</p>`}
    <footer class="foot">
      <button data-sheet="settings">${tx.settings}</button>
      <button data-sheet="help">${tx.help}</button>
      <a href="privacy.html">${tx.privacy}</a>
      <a href="https://japps.ai"${ext}>Japps.ai</a>
    </footer>`;
  $("#player").hidden = true;
  document.title = "Lamp — " + tx.sub;
  const on = document.querySelector('.chips [aria-pressed="true"]'); if (on && filter !== "all") on.scrollIntoView({ inline:"center", block:"nearest" });
}

function renderStory(id, autoplay){
  stopReading();
  const i = STORIES.findIndex(s => s.id === id);
  if (i < 0) return renderHome();
  currentId = id;
  const st = STORIES[i], s = L(st), tx = T();
  const prev = STORIES[(i - 1 + STORIES.length) % STORIES.length], next = STORIES[(i + 1) % STORIES.length];
  const on = saved.has(st.id);
  const h = n => `<h2 data-sec>${say(tx.sec[n])}</h2>`;
  $("#app").innerHTML = `
    <div class="topbar">
      <button class="ghost" data-home>${icons.back} ${tx.back}</button>
      <div class="right"><button class="ghost" data-save="${st.id}" aria-pressed="${on}">${icons.heart} ${on ? tx.saved : tx.save}</button>${toolBtns()}</div>
    </div>
    <article class="story" lang="${lang}">
      <h1>${say(s.title, s.title + ". " + s.spoken + ".")}</h1>
      <p class="ref">${esc(s.ref)} · ${esc(tx.themes[st.theme])}</p>
      ${h(0)}<p>${sayPara(s.story)}</p>
      ${h(1)}
      <div class="passage">
        <p class="ver">${tx.version}</p>
        ${s.passage.map(([n, t]) => `<p><sup>${n}</sup>${sentences(t).map(x => say(x)).join("")}</p>`).join("")}
      </div>
      ${h(2)}<p>${sayPara(s.meaning)}</p>
      ${h(3)}<p>${sayPara(s.good)}</p>
      ${h(4)}<p class="carry">${sayPara(s.carry)}</p>
      ${h(5)}<p>${sayPara(s.prayer)}</p>
      <nav class="pager">
        <button data-open="${prev.id}"><small>${tx.prev}</small><span>${esc(L(prev).title)}</span></button>
        <button data-open="${next.id}"><small>${tx.next}</small><span>${esc(L(next).title)}</span></button>
      </nav>
    </article>`;
  document.title = s.title + " — Lamp";
  $("#player").hidden = false;
  segs = [...document.querySelectorAll(".story .say")];
  curHash = fnv(segs.map(segText).join("\n"));
  idx = 0; updateNow(); updateProg();
  window.scrollTo(0,0);
  if (autoplay) speakFrom(0);
}

function rerender(){ currentId ? renderStory(currentId) : renderHome(); }

/* ---------- appearance ---------- */
function applyLook(){
  const root = document.documentElement;
  if (themePref === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", themePref);
  root.style.setProperty("--ts", TEXT_SIZES[size] || 1);
  root.lang = lang;
  const tx = T();
  $("#back").setAttribute("aria-label", tx.prevS); $("#fwd").setAttribute("aria-label", tx.nextS);
  $("#pgear").setAttribute("aria-label", tx.settings); $("#pgear").innerHTML = icons.gear;
  $("#nosupport").textContent = tx.nosupport;
}

/* ---------- voices ---------- */
const synth = window.speechSynthesis || null;
let deviceVoices = [], audioIndex = null;
const voiceKey = () => "lamp.voice." + lang;
function loadDeviceVoices(){
  if (!synth) return;
  deviceVoices = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith(lang));
  if ($("#settings").open) renderSettings();
}
function bestDevice(){
  const prefer = lang === "es"
    ? [/natural/i,/premium|mejorad/i,/enhanced/i,/paulina|mónica|monica|marisol/i,/google español/i,/dalia|elvira|sabina|helena/i]
    : [/natural/i,/premium/i,/enhanced/i,/samantha/i,/google us english/i,/aria|jenny|guy/i,/daniel|karen|moira/i];
  for (const p of prefer){ const v = deviceVoices.find(v => p.test(v.name)); if (v) return v; }
  return deviceVoices.find(v => v.default) || deviceVoices[0] || null;
}
const lampVoices = () => (audioIndex && audioIndex.voices && audioIndex.voices[lang]) || [];
function voiceChoice(){
  let c = store.get(voiceKey(), null);
  if (typeof c === "string" && !c.includes(":")) c = "dev:" + c;               // settings saved by the older version
  if (c && c.startsWith("lamp:") && !lampVoices().some(v => "lamp:" + v.id === c)) c = null;
  if (!c) c = lampVoices().length ? "lamp:" + lampVoices()[0].id : "dev:";
  return c;
}
function deviceVoice(){
  const c = voiceChoice(), uri = c.startsWith("dev:") ? c.slice(4) : "";
  return deviceVoices.find(v => v.voiceURI === uri) || bestDevice();
}
function lampReady(){
  const c = voiceChoice();
  if (!c.startsWith("lamp:") || !audioIndex || !currentId) return false;
  const e = audioIndex.stories && audioIndex.stories[`${c.slice(5)}/${lang}/${currentId}`];
  return !!e && e.h === curHash && e.n === segs.length;
}
async function loadAudioIndex(){
  try {
    const r = await fetch("audio/index.json", { cache:"no-cache" });
    if (!r.ok) return;
    audioIndex = await r.json();
    if ($("#settings").open) renderSettings();
    updateNow(); checkSupport();
  } catch(e){}
}
function checkSupport(){
  const none = !synth && !lampVoices().length;
  $("#ctrls").hidden = none; $("#nosupport").hidden = !none;
}

/* ---------- reading engine ---------- */
let segs = [], idx = 0, playing = false, engine = null, current = null, pending = 0, token = 0, unlocked = false;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const audio = new Audio(); audio.preload = "auto";
const blobs = new Map();

function highlight(){
  segs.forEach((el, n) => el.classList.toggle("on", playing && n === idx));
  const el = segs[idx];
  if (playing && el){
    const r = el.getBoundingClientRect(), h = innerHeight - 110;
    if (r.top < 60 || r.bottom > h) el.scrollIntoView({ block:"center", behavior: reduce ? "auto" : "smooth" });
  }
}
function sectionName(){
  const el = segs[idx]; let name = T().titleSeg;
  for (const h of document.querySelectorAll(".story h2[data-sec]")) if (el && (h === el.parentNode || (h.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING))) name = h.textContent;
  return name;
}
function updateNow(){
  if (!$("#now")) return;
  const tx = T(), title = (document.querySelector(".story h1") || {}).textContent || "";
  const badge = (playing ? engine === "lamp" : lampReady()) ? `<span class="badge">${tx.aiVoice}</span>` : "";
  $("#now").innerHTML = playing
    ? `<b>${esc(sectionName())}${badge}</b>${esc(title)}`
    : `<b>${idx > 0 ? tx.paused : tx.tapPlay}${badge}</b>${idx > 0 ? esc(title) : tx.tapAny}`;
  $("#play").innerHTML = playing ? icons.pause : icons.play;
  $("#play").setAttribute("aria-label", playing ? tx.pause : tx.play);
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = playing ? "playing" : "paused";
}
function updateProg(){ $("#prog").style.width = segs.length ? (idx / segs.length * 100) + "%" : "0"; }
function finish(){ playing = false; idx = 0; highlight(); updateNow(); updateProg(); }

function halt(){
  token++; clearTimeout(pending);
  audio.pause();
  if (current) current.cancelled = true;
  if (synth) synth.cancel();
}
function speakFrom(i){
  if (!segs.length) return;
  halt();
  idx = Math.max(0, Math.min(i, segs.length - 1)); playing = true; updateProg();
  if (lampReady()) { engine = "lamp"; unlockAudio(); setMediaSession(); playLamp(); }
  else if (synth) { engine = "device"; speakDevice(); }
  else { playing = false; updateNow(); }
}
function pauseReading(){ playing = false; halt(); highlight(); updateNow(); }
function stopReading(){ playing = false; halt(); segs = []; idx = 0; for (const p of blobs.values()) p.then(u => URL.revokeObjectURL(u)).catch(() => {}); blobs.clear(); }

/* Device voices (browser speech) */
function speakDevice(){
  if (!playing || engine !== "device") return;
  if (idx >= segs.length) return finish();
  const u = new SpeechSynthesisUtterance(segText(segs[idx]));
  u.rate = DEVICE_RATES[speed];
  const v = deviceVoice();
  if (v){ u.voice = v; u.lang = v.lang; } else u.lang = lang === "es" ? "es-MX" : "en-US";
  u.onend = () => { if (u.cancelled) return; idx++; updateProg(); speakDevice(); };
  u.onerror = () => { if (u.cancelled) return; idx++; speakDevice(); };
  current = u; highlight(); updateNow();
  synth.speak(u);
}

/* Lamp voices (recorded audio, one small file per sentence) */
function unlockAudio(){ if (unlocked) return; unlocked = true; audio.src = SILENT; audio.play().catch(() => {}); }
const segUrl = i => `audio/${voiceChoice().slice(5)}/${lang}/${currentId}/${String(i).padStart(3, "0")}.mp3`;
function getClip(i){
  if (i >= segs.length) return Promise.resolve(null);
  const u = segUrl(i);
  if (!blobs.has(u)) {
    const p = fetch(u).then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); }).then(b => URL.createObjectURL(b));
    blobs.set(u, p); p.catch(() => blobs.delete(u));
  }
  return blobs.get(u);
}
async function playLamp(){
  const my = token;
  if (!playing || engine !== "lamp") return;
  if (idx >= segs.length) return finish();
  highlight(); updateNow();
  let url;
  try { url = await getClip(idx); }
  catch(e){ if (my === token && synth) { engine = "device"; speakDevice(); } return; }   // offline or missing: use the phone's voice
  if (my !== token || !playing) return;
  audio.src = url; audio.playbackRate = AUDIO_RATES[speed];
  try { await audio.play(); } catch(e){ if (my === token) { playing = false; updateNow(); } return; }
  getClip(idx + 1).catch(() => {}); getClip(idx + 2).catch(() => {});
}
audio.addEventListener("ended", () => {
  if (engine !== "lamp" || !playing || audio.src === SILENT) return;
  const el = segs[idx], nx = segs[idx + 1];
  const gap = el && el.closest("h1,h2") ? 380 : (nx && nx.parentNode !== el.parentNode ? 320 : 90);
  idx++; updateProg();
  const my = token;
  pending = setTimeout(() => { if (my === token) playLamp(); }, gap / AUDIO_RATES[speed]);
});
function setMediaSession(){
  if (!("mediaSession" in navigator)) return;
  const s = STORIES.find(x => x.id === currentId);
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: L(s).title, artist: "Lamp", album: L(s).ref,
      artwork: [{ src:"icon-512.png", sizes:"512x512", type:"image/png" }] });
    navigator.mediaSession.setActionHandler("play", () => speakFrom(idx));
    navigator.mediaSession.setActionHandler("pause", pauseReading);
    navigator.mediaSession.setActionHandler("previoustrack", () => speakFrom(Math.max(0, idx - 1)));
    navigator.mediaSession.setActionHandler("nexttrack", nextSection);
  } catch(e){}
}
function nextSection(){
  const heads = segs.map((el, n) => el.closest("h2") ? n : -1).filter(n => n > idx);
  if (heads.length) speakFrom(heads[0]);
}

/* ---------- settings sheet ---------- */
const previewAudio = new Audio();
function renderSettings(){
  const tx = T(), c = voiceChoice(), lv = lampVoices();
  const opt = (v, label) => `<option value="${esc(v)}"${v === c ? " selected" : ""}>${esc(label)}</option>`;
  const dv = deviceVoice();
  const deviceOpts = deviceVoices.length
    ? deviceVoices.map(v => opt("dev:" + v.voiceURI, v.name)).join("")
    : opt("dev:", tx.deviceDefault);
  const devSel = c.startsWith("dev:") && dv ? "dev:" + dv.voiceURI : c;
  const select = `<select id="voiceSel" aria-label="${tx.voiceL}">
      ${lv.length ? `<optgroup label="${tx.lampGroup}">${lv.map(v => opt("lamp:" + v.id, "Lamp · " + v.label)).join("")}</optgroup>` : ""}
      ${synth ? `<optgroup label="${tx.deviceGroup}">${deviceOpts}</optgroup>` : ""}
    </select>`.replace(`value="${esc(devSel)}"`, `value="${esc(devSel)}" selected`);
  const seg = (key, labels, cur) => `<div class="opts" role="group">${labels.map((l, i) => {
      const val = Array.isArray(cur) ? cur[1][i] : i;
      const on = Array.isArray(cur) ? cur[0] === val : cur === i;
      return `<button data-${key}="${val}" aria-pressed="${on}">${esc(l)}</button>`; }).join("")}</div>`;
  $("#settings").innerHTML = `
    <div class="hd"><h2 id="settings-h">${tx.settings}</h2><button class="ghost" data-close>${tx.close}</button></div>
    <div class="bd">
      <h3>${tx.language}</h3>
      ${seg("lang", ["English", "Español"], [lang, ["en", "es"]])}
      <h3>${tx.voiceL}</h3>
      <div class="voicerow">${select}<button class="ghost" data-preview>${icons.play.replace('<svg', '<svg width="14" height="14"')} ${tx.preview}</button></div>
      <p>${c.startsWith("lamp:") ? tx.lampNote : (lv.length ? tx.deviceNote : tx.noLamp)}</p>
      <h3>${tx.speedL}</h3>
      ${seg("speed", tx.speeds, speed)}
      <h3>${tx.sizeL}</h3>
      ${seg("size", tx.sizes, size)}
      <h3>${tx.themeL}</h3>
      ${seg("theme", tx.themes3, [themePref, ["auto", "light", "dark"]])}
      <p class="note">${tx.needHelp} <button class="linkbtn" data-sheet="help">${tx.help}</button></p>
    </div>`;
}
function previewVoice(){
  const c = voiceChoice();
  previewAudio.pause(); if (synth) synth.cancel();
  if (playing) pauseReading();
  if (c.startsWith("lamp:")) {
    previewAudio.src = `audio/${c.slice(5)}/${lang}/_sample.mp3`;
    previewAudio.playbackRate = AUDIO_RATES[speed];
    previewAudio.play().catch(() => {});
  } else if (synth) {
    const u = new SpeechSynthesisUtterance(SAMPLE[lang]); u.rate = DEVICE_RATES[speed];
    const v = deviceVoice(); if (v){ u.voice = v; u.lang = v.lang; } else u.lang = lang === "es" ? "es-MX" : "en-US";
    synth.speak(u);
  }
}

/* ---------- help sheet ---------- */
let installEvent = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvent = e; });
window.addEventListener("appinstalled", () => { installEvent = null; });
async function installApp(){
  if (!installEvent) return;
  installEvent.prompt();
  try { await installEvent.userChoice; } catch(e){}
  installEvent = null; closeSheets();
}
function renderHelp(){
  const tx = T(), h = tx.h;
  const steps = a => `<ol>${a.map(s => `<li>${esc(s)}</li>`).join("")}</ol>`;
  const home = standalone ? `<p class="note">${h.installed}</p>` : `
      <p>${h.homeP}</p>
      ${installEvent ? `<button class="primary" data-install>${h.install}</button>` : ""}
      <h4>${h.iphone}</h4>${steps(h.homeIOS)}
      <h4>${h.android}</h4>${steps(h.homeAnd)}`;
  $("#help").innerHTML = `
    <div class="hd"><h2 id="help-h">${tx.help}</h2><button class="ghost" data-close>${tx.close}</button></div>
    <div class="bd">
      <h3>${h.listenH}</h3>${steps(h.listen)}
      <h3>${h.voiceH}</h3><p>${h.voiceP}</p>
      <p><button class="primary" data-sheet="settings">${icons.gear.replace('<svg', '<svg width="16" height="16"')} ${tx.settings}</button></p>
      <h3>${h.deviceH}</h3><p>${h.deviceP}</p>
      <h4>${h.iphone}</h4>${steps(h.voiceIOS)}
      <h4>${h.android}</h4>${steps(h.voiceAnd)}
      <h3>${h.homeH}</h3>${home}
      <h3>${h.aboutH}</h3><p>${h.about}</p>
      <p><a href="privacy.html">${tx.privacy}</a></p>
    </div>`;
}
function openSheet(name){
  closeSheets();
  name === "settings" ? renderSettings() : renderHelp();
  const d = $("#" + name);
  if (d.showModal) d.showModal(); else d.setAttribute("open", "");
  d.scrollTop = 0;
}
function closeSheets(){
  previewAudio.pause();
  for (const d of document.querySelectorAll("dialog.sheet")) if (d.open) (d.close ? d.close() : d.removeAttribute("open"));
}
for (const d of document.querySelectorAll("dialog.sheet")) d.addEventListener("click", e => { if (e.target === d) closeSheets(); });

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-open],[data-home],[data-filter],[data-save],[data-sheet],[data-close],[data-install],[data-lang],[data-speed],[data-size],[data-theme],[data-preview],.say");
  if (!t) return;
  if (t.matches("[data-sheet]")) openSheet(t.dataset.sheet);
  else if (t.matches("[data-close]")) closeSheets();
  else if (t.matches("[data-install]")) installApp();
  else if (t.matches("[data-preview]")) previewVoice();
  else if (t.matches("[data-lang]")) {
    if (t.dataset.lang === lang) return;
    lang = t.dataset.lang; store.set("lamp.lang", lang);
    loadDeviceVoices(); applyLook(); rerender(); renderSettings();
  }
  else if (t.matches("[data-speed]")) {
    speed = +t.dataset.speed; store.set("lamp.speed", speed); renderSettings();
    if (playing && engine === "lamp") audio.playbackRate = AUDIO_RATES[speed];
    else if (playing) speakFrom(idx);
  }
  else if (t.matches("[data-size]")) { size = +t.dataset.size; store.set("lamp.size", size); applyLook(); renderSettings(); }
  else if (t.matches("[data-theme]")) { themePref = t.dataset.theme; store.set("lamp.theme", themePref); applyLook(); renderSettings(); }
  else if (t.matches("[data-open]")) { location.hash = "s=" + t.dataset.open; renderStory(t.dataset.open, !!t.dataset.autoplay); }
  else if (t.matches("[data-home]")) { history.pushState(null, "", location.pathname + location.search); renderHome(); }
  else if (t.matches("[data-filter]")) { filter = t.dataset.filter; renderHome(); }
  else if (t.matches("[data-save]")) {
    const id = t.dataset.save; saved.has(id) ? saved.delete(id) : saved.add(id); store.set("lamp.saved", [...saved]);
    const on = saved.has(id); t.setAttribute("aria-pressed", on); t.innerHTML = icons.heart + " " + (on ? T().saved : T().save);
  }
  else if (t.matches(".say")) speakFrom(segs.indexOf(t));
});
document.addEventListener("change", e => {
  if (e.target.id !== "voiceSel") return;
  store.set(voiceKey(), e.target.value); renderSettings(); updateNow();
  if (playing) speakFrom(idx);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".say")) { e.preventDefault(); e.target.click(); }
});
$("#play").onclick = () => playing ? pauseReading() : speakFrom(idx);
$("#back").onclick = () => speakFrom(Math.max(0, idx - 1));
$("#fwd").onclick = nextSection;
window.addEventListener("hashchange", route);

function route(){
  const m = location.hash.match(/s=([\w-]+)/);
  if (m) { if (m[1] !== currentId) renderStory(m[1]); }
  else renderHome();
}
if (synth){ loadDeviceVoices(); synth.onvoiceschanged = loadDeviceVoices; }
applyLook(); checkSupport(); route(); loadAudioIndex();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
