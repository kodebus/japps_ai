<style>
:root{
  --bg:#EAF0F4; --surface:#F8FAFB; --ink:#1E2340; --muted:#5A6078; --olive:#4F6B3C; --olive-ink:#ffffff;
  --glow:#F3D97F; --glow-ink:#1E2340; --line:#D3DBE3;
  --serif:"Spectral", Georgia, "Times New Roman", serif;
  --sans:"Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11162A; --surface:#1A2038; --ink:#E8EBF4; --muted:#9AA1B9; --olive:#9DBB84; --olive-ink:#11162A;
    --glow:#E8C766; --glow-ink:#11162A; --line:#2B3352;
  }
}
:root[data-theme="dark"]{
  --bg:#11162A; --surface:#1A2038; --ink:#E8EBF4; --muted:#9AA1B9; --olive:#9DBB84; --olive-ink:#11162A;
  --glow:#E8C766; --glow-ink:#11162A; --line:#2B3352;
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.5; -webkit-text-size-adjust:100%; }
button,select{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--olive); outline-offset:2px; border-radius:4px; }
.wrap{ max-width:40rem; margin:0 auto; padding:calc(1.5rem + env(safe-area-inset-top,0px)) 1.25rem calc(9rem + env(safe-area-inset-bottom,0px)); }

.brand{ display:flex; align-items:center; gap:.6rem; margin:1rem 0 2rem; }
.brand svg{ width:28px; height:28px; flex:none; }
.brand b{ font-weight:600; font-size:1.3rem; }
.brand span{ color:var(--muted); font-size:.95rem; flex:1; min-width:0; }
.seg{ display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; flex:none; }
.seg button{ background:none; border:0; padding:.3rem .75rem; font-size:.88rem; color:var(--muted); }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); }

.today{ padding:0 0 2.25rem; border-bottom:1px solid var(--line); margin-bottom:1.75rem; }
.today small{ color:var(--muted); font-size:.95rem; }
.today h1{ font-family:var(--serif); font-weight:600; font-size:clamp(2.1rem,7vw,3rem); line-height:1.1; margin:.35rem 0 .75rem; }
.today p{ font-size:calc(1.2rem * var(--ts,1)) !important; font-family:var(--serif); font-style:italic; font-size:1.2rem; line-height:1.55; margin:0 0 1.5rem; }
.primary{ display:inline-flex; align-items:center; gap:.55rem; background:var(--olive); color:var(--olive-ink); border:0; border-radius:999px; padding:.8rem 1.35rem; font-weight:500; }
.primary svg{ width:18px; height:18px; }

.listhead{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:.75rem; }
.listhead h2{ font-size:1.1rem; font-weight:600; margin:0; }
.listhead span{ color:var(--muted); font-size:.9rem; }
.chips{ display:flex; gap:.45rem; overflow-x:auto; padding:.1rem .1rem .6rem; margin:0 -1.25rem; padding-left:1.25rem; padding-right:1.25rem; scrollbar-width:none; }
.chips::-webkit-scrollbar{ display:none; }
.chips button{ flex:none; background:none; border:1px solid var(--line); border-radius:999px; padding:.35rem .85rem; font-size:.92rem; color:var(--ink); }
.chips button[aria-pressed="true"]{ background:var(--olive); border-color:var(--olive); color:var(--olive-ink); }
.list{ list-style:none; margin:0; padding:0; }
.list li button{ width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:1rem 0; display:grid; grid-template-columns:1fr auto; gap:.1rem 1rem; align-items:center; }
.list .t{ font-family:var(--serif); font-size:1.25rem; font-weight:600; }
.list .m{ color:var(--muted); font-size:.92rem; grid-column:1; }
.list .theme{ grid-row:1 / span 2; grid-column:2; font-size:.85rem; color:var(--olive); border:1px solid currentColor; border-radius:999px; padding:.15rem .6rem; white-space:nowrap; }
.empty{ color:var(--muted); padding:1.25rem 0; }

.topbar{ display:flex; justify-content:space-between; align-items:center; gap:.5rem; margin:.25rem 0 1.75rem; }
.topbar .right{ display:flex; gap:.5rem; align-items:center; }
.ghost{ background:none; border:1px solid var(--line); border-radius:999px; padding:.4rem .9rem; display:inline-flex; align-items:center; gap:.4rem; font-size:.95rem; }
.ghost svg{ width:16px; height:16px; }
.ghost[aria-pressed="true"]{ border-color:var(--olive); color:var(--olive); }
.ghost[aria-pressed="true"] svg path{ fill:currentColor; }
.story h1{ font-family:var(--serif); font-weight:600; font-size:clamp(2rem,6.5vw,2.8rem); line-height:1.12; margin:0 0 .4rem; }
.story .ref{ color:var(--muted); margin:0 0 2rem; }
.story h2{ font-size:.95rem; font-weight:600; color:var(--olive); margin:2.25rem 0 .5rem; }
.story p{ font-family:var(--serif); font-size:calc(1.18rem * var(--ts,1)); line-height:1.7; margin:0 0 1rem; }
.passage{ border-left:3px solid var(--glow); padding-left:1.1rem; }
.passage .ver{ color:var(--muted); font-family:var(--sans); font-size:.9rem; margin:-.25rem 0 .75rem; }
.passage p{ margin:0 0 .6rem; }
.passage sup{ font-family:var(--sans); font-size:.7rem; color:var(--muted); margin-right:.3rem; vertical-align:.45em; }
.story p.carry{ font-style:italic; font-size:calc(1.4rem * var(--ts,1)); line-height:1.45; }
.say{ border-radius:3px; transition:background-color .2s, color .2s; cursor:pointer; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
.say.on{ background:var(--glow); color:var(--glow-ink); }
.pager{ display:flex; justify-content:space-between; gap:1rem; margin-top:3rem; padding-top:1.25rem; border-top:1px solid var(--line); }
.pager button{ background:none; border:0; text-align:left; padding:0; max-width:48%; }
.pager button:last-child{ text-align:right; margin-left:auto; }
.pager small{ display:block; color:var(--muted); font-size:.85rem; }
.pager span{ font-family:var(--serif); font-weight:600; font-size:1.05rem; }

.player{ position:fixed; left:0; right:0; bottom:0; padding-bottom:env(safe-area-inset-bottom,0px); background:var(--surface); border-top:1px solid var(--line); z-index:5; }
.player[hidden]{ display:none; }
.bar{ height:3px; background:var(--line); }
.bar i{ display:block; height:100%; width:0; background:var(--olive); transition:width .3s; }
.ctrls{ max-width:40rem; margin:0 auto; padding:.7rem 1.25rem; display:flex; align-items:center; gap:.75rem; }
.ctrls[hidden]{ display:none; }
.play{ width:52px; height:52px; border-radius:50%; border:0; background:var(--olive); color:var(--olive-ink); display:grid; place-items:center; flex:none; }
.play svg{ width:22px; height:22px; }
.icon{ width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:none; display:grid; place-items:center; flex:none; }
.icon svg{ width:18px; height:18px; }
.now{ flex:1; min-width:0; font-size:.9rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.now b{ color:var(--ink); font-weight:500; display:block; overflow:hidden; text-overflow:ellipsis; }
.settings{ max-width:40rem; margin:0 auto; padding:0 1.25rem .8rem; display:flex; gap:.75rem; flex-wrap:wrap; }
.settings[hidden]{ display:none; }
.settings label{ font-size:.85rem; color:var(--muted); display:flex; flex-direction:column; gap:.2rem; flex:1 1 9rem; min-width:0; }
.settings select{ background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:.45rem .5rem; width:100%; }
.settings p{ flex-basis:100%; margin:0; font-size:.85rem; color:var(--muted); }
.nosupport{ max-width:40rem; margin:0 auto; padding:.9rem 1.25rem; font-size:.92rem; color:var(--muted); }
.jlink{ display:inline-block; font-size:.9rem; color:var(--muted); text-decoration:none; }
.jlink:hover{ color:var(--olive); }
.foot{ margin-top:3rem; padding-top:1.25rem; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:.5rem 1.4rem; font-size:.92rem; }
.foot a,.foot button,.linkbtn{ color:var(--muted); background:none; border:0; padding:0; font-size:inherit; text-decoration:underline; text-underline-offset:3px; }
.foot span{ color:var(--muted); margin-left:auto; }
.linkbtn{ font-size:.85rem; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; scroll-behavior:auto !important; } }

/* header tools */
.topline{ display:flex; justify-content:space-between; align-items:center; gap:1rem; }
.tools{ display:flex; gap:.5rem; }
.icon.lg{ width:42px; height:42px; }
.icon svg{ width:19px; height:19px; }

/* sheets */
dialog.sheet{ width:calc(100% - 1.5rem); max-width:34rem; max-height:88vh; border:0; border-radius:18px; background:var(--surface); color:var(--ink); padding:0; overflow:auto; }
dialog.sheet::backdrop{ background:rgba(17,22,42,.5); }
.sheet .hd{ position:sticky; top:0; background:var(--surface); display:flex; justify-content:space-between; align-items:center; padding:1.1rem 1.3rem .8rem; border-bottom:1px solid var(--line); z-index:1; }
.sheet .bd{ padding:.4rem 1.3rem 1.4rem; }
.sheet h2{ font-family:var(--serif); font-weight:600; font-size:1.55rem; margin:0; }
.sheet h3{ font-size:1rem; font-weight:600; color:var(--olive); margin:1.4rem 0 .45rem; }
.sheet h4{ font-size:.95rem; font-weight:600; margin:1rem 0 .25rem; }
.sheet p,.sheet li{ font-size:.97rem; line-height:1.55; }
.sheet p{ margin:.3rem 0; color:var(--muted); }
.sheet ol,.sheet ul{ margin:.25rem 0; padding-left:1.25rem; }
.sheet .note{ background:var(--bg); border-radius:10px; padding:.7rem .9rem; margin-top:.8rem; color:var(--ink); }
.sheet .primary{ margin-top:.6rem; }
.sheet a{ color:var(--olive); }
.opts{ display:flex; flex-wrap:wrap; gap:.45rem; }
.opts button{ background:none; border:1px solid var(--line); border-radius:999px; padding:.45rem .95rem; font-size:.95rem; }
.opts button[aria-pressed="true"]{ background:var(--olive); border-color:var(--olive); color:var(--olive-ink); }
.sheet select{ width:100%; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:.6rem .6rem; font-size:1rem; }
.voicerow{ display:flex; gap:.5rem; align-items:center; }
.voicerow select{ flex:1; min-width:0; }
.voicerow .ghost{ flex:none; }
.badge{ display:inline-block; font-size:.72rem; font-weight:500; color:var(--olive); border:1px solid currentColor; border-radius:999px; padding:0 .45rem; margin-left:.35rem; vertical-align:.1em; }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<dialog class="sheet" id="settings" aria-labelledby="settings-h"></dialog>
<dialog class="sheet" id="help" aria-labelledby="help-h"></dialog>

<div class="player" id="player" hidden>
  <div class="bar"><i id="prog"></i></div>
  <div class="ctrls" id="ctrls">
    <button class="icon" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20 9 12l10-8v16Z"/><path d="M5 19V5"/></svg></button>
    <button class="play" id="play"></button>
    <button class="icon" id="fwd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 4 10 8-10 8V4Z"/><path d="M19 5v14"/></svg></button>
    <div class="now" id="now"></div>
    <button class="icon" id="pgear" data-sheet="settings"></button>
  </div>
  <div class="nosupport" id="nosupport" hidden></div>
</div>

<script>
/*SHARED-START*/
const STORIES = [{"id": "samaritan", "theme": "kindness", "en": {"title": "The Good Samaritan", "ref": "Luke 10:30–37", "spoken": "Luke, chapter 10, verses 30 through 37", "story": "A man asked Jesus, Who is my neighbour? Jesus answered with a story about a traveler who was robbed, beaten, and left on the road. Two respected religious men saw him and walked past. Then a Samaritan, someone the listeners would have looked down on, stopped to help.", "passage": [[30, "And Jesus answering said, A certain man went down from Jerusalem to Jericho, and fell among thieves, which stripped him of his raiment, and wounded him, and departed, leaving him half dead."], [31, "And by chance there came down a certain priest that way: and when he saw him, he passed by on the other side."], [32, "And likewise a Levite, when he was at the place, came and looked on him, and passed by on the other side."], [33, "But a certain Samaritan, as he journeyed, came where he was: and when he saw him, he had compassion on him,"], [34, "And went to him, and bound up his wounds, pouring in oil and wine, and set him on his own beast, and brought him to an inn, and took care of him."], [35, "And on the morrow when he departed, he took out two pence, and gave them to the host, and said unto him, Take care of him; and whatsoever thou spendest more, when I come again, I will repay thee."], [36, "Which now of these three, thinkest thou, was neighbour unto him that fell among the thieves?"], [37, "And he said, He that shewed mercy on him. Then said Jesus unto him, Go, and do thou likewise."]], "meaning": "The two men who passed by probably had their reasons. They were busy, or afraid, or worried about getting involved. The Samaritan had reasons too, yet compassion moved him first. Jesus turns the question around. Instead of asking who deserves my help, He asks: will I be a neighbour to whoever is in front of me?", "good": "God’s love is not a reward we earn. It is poured out on everyone, and when we help a stranger we pass on the same mercy we have received. Good done quietly, with no one watching, is still seen by God, and it changes the heart of the one who does it.", "carry": "Today, notice one person others walk past, and stop.", "prayer": "Lord, give me eyes that see people in need, and a heart that does not pass by."}, "es": {"title": "El buen samaritano", "ref": "Lucas 10:30–37", "spoken": "Lucas, capítulo 10, versículos 30 al 37", "story": "Un hombre le preguntó a Jesús: ¿Quién es mi prójimo? Jesús respondió con la historia de un viajero al que asaltaron, golpearon y dejaron tirado en el camino. Dos hombres religiosos muy respetados lo vieron y siguieron de largo. Entonces un samaritano, alguien a quien los oyentes despreciaban, se detuvo a ayudarlo.", "passage": [[30, "Y respondiendo Jesús, dijo: Un hombre descendía de Jerusalem á Jericó, y cayó en manos de ladrones, los cuales le despojaron; é hiriéndole, se fueron, dejándole medio muerto."], [31, "Y aconteció, que descendió un sacerdote por aquel camino, y viéndole, se pasó de un lado."], [32, "Y asimismo un Levita, llegando cerca de aquel lugar, y viéndole, se pasó de un lado."], [33, "Mas un Samaritano que transitaba, viniendo cerca de él, y viéndole, fué movido á misericordia;"], [34, "Y llegándose, vendó sus heridas, echándo les aceite y vino; y poniéndole sobre su cabalgadura, llevóle al mesón, y cuidó de él."], [35, "Y otro día al partir, sacó dos denarios, y diólos al huésped, y le dijo: Cuídamele; y todo lo que de más gastares, yo cuando vuelva te lo pagaré."], [36, "¿Quién, pues, de estos tres te parece que fué el prójimo de aquél que cayó en manos de los ladrones?"], [37, "Y él dijo: El que usó con él de misericordia. Entonces Jesús le dijo: Ve, y haz tú lo mismo."]], "meaning": "Los dos hombres que pasaron de largo seguramente tenían sus razones. Estaban ocupados, tenían miedo o no querían complicarse. El samaritano también tenía razones, pero en él la compasión llegó primero. Jesús le da la vuelta a la pregunta. En lugar de preguntar quién merece mi ayuda, pregunta: ¿seré yo prójimo de quien tengo enfrente?", "good": "El amor de Dios no es un premio que se gana. Se derrama sobre todos, y cuando ayudamos a un desconocido compartimos la misma misericordia que hemos recibido. El bien que se hace en silencio, sin que nadie lo vea, también lo ve Dios, y transforma el corazón de quien lo hace.", "carry": "Hoy, fíjate en alguien a quien otros pasan de largo, y detente.", "prayer": "Señor, dame ojos que vean a quien sufre, y un corazón que no pase de largo."}}, {"id": "loaves", "theme": "generosity", "en": {"title": "The Boy With Five Loaves", "ref": "John 6:9–13", "spoken": "John, chapter 6, verses 9 through 13", "story": "Thousands of people had followed Jesus all day, and they were hungry. The disciples could find only one boy with a small lunch: five barley loaves and two fish. He gave it anyway.", "passage": [[9, "There is a lad here, which hath five barley loaves, and two small fishes: but what are they among so many?"], [10, "And Jesus said, Make the men sit down. Now there was much grass in the place. So the men sat down, in number about five thousand."], [11, "And Jesus took the loaves; and when he had given thanks, he distributed to the disciples, and the disciples to them that were set down; and likewise of the fishes as much as they would."], [12, "When they were filled, he said unto his disciples, Gather up the fragments that remain, that nothing be lost."], [13, "Therefore they gathered them together, and filled twelve baskets with the fragments of the five barley loaves, which remained over and above unto them that had eaten."]], "meaning": "The disciples looked at the lunch and wondered what use it could be among so many. Jesus looked at the same lunch and gave thanks. In His hands, a small offering fed everyone, with twelve baskets left over. God does not need us to have much. He asks us to offer what we have.", "good": "It is easy to think our small kindness won’t matter. This story says otherwise. A little given with trust can become more than enough, because God multiplies what we place in His hands.", "carry": "Don’t wait until you have more. Offer the little you have today.", "prayer": "Father, here is what I have. Take it and use it for good."}, "es": {"title": "El niño de los cinco panes", "ref": "Juan 6:9–13", "spoken": "Juan, capítulo 6, versículos 9 al 13", "story": "Miles de personas habían seguido a Jesús todo el día y tenían hambre. Los discípulos solo encontraron a un muchacho con un almuerzo pequeño: cinco panes de cebada y dos peces. Aun así, él lo entregó.", "passage": [[9, "Un muchacho está aquí que tiene cinco panes de cebada y dos pececillos; ¿mas qué es esto entre tantos?"], [10, "Entonces Jesús dijo: Haced recostar la gente. Y había mucha hierba en aquel lugar: y recostáronse como número de cinco mil varones."], [11, "Y tomó Jesús aquellos panes, y habiendo dado gracias, repartió á los discípulos, y los discípulos á los que estaban recostados: asimismo de los peces, cuanto querían."], [12, "Y como fueron saciados, dijo á sus discípulos: Recoged los pedazos que han quedado, porque no se pierda nada."], [13, "Cogieron pues, é hinchieron doce cestas de pedazos de los cinco panes de cebada, que sobraron á los que habían comido."]], "meaning": "Los discípulos miraron ese almuerzo y se preguntaron de qué serviría entre tantos. Jesús miró el mismo almuerzo y dio gracias. En Sus manos, esa pequeña ofrenda alimentó a todos, y sobraron doce canastas. Dios no necesita que tengamos mucho. Nos pide que ofrezcamos lo que tenemos.", "good": "Es fácil pensar que nuestra pequeña bondad no importa. Esta historia dice lo contrario. Lo poco que se da con confianza puede llegar a ser más que suficiente, porque Dios multiplica lo que ponemos en Sus manos.", "carry": "No esperes a tener más. Ofrece hoy lo poco que tienes.", "prayer": "Padre, aquí está lo que tengo. Tómalo y úsalo para bien."}}, {"id": "david", "theme": "courage", "en": {"title": "David and Goliath", "ref": "1 Samuel 17:37, 45, 47", "spoken": "First Samuel, chapter 17", "story": "The army of Israel stood frozen with fear before a giant warrior named Goliath. A young shepherd named David came to bring food to his brothers and heard the giant mocking God. With only a sling and five smooth stones, he offered to face him.", "passage": [[37, "David said moreover, The Lord that delivered me out of the paw of the lion, and out of the paw of the bear, he will deliver me out of the hand of this Philistine. And Saul said unto David, Go, and the Lord be with thee."], [45, "Then said David to the Philistine, Thou comest to me with a sword, and with a spear, and with a shield: but I come to thee in the name of the Lord of hosts, the God of the armies of Israel, whom thou hast defied."], [47, "And all this assembly shall know that the Lord saveth not with sword and spear: for the battle is the Lord’s, and he will give you into our hands."]], "meaning": "David’s confidence did not come from his size or his weapons. It came from memory. God had protected him before, from the lion and the bear. Remembering God’s past faithfulness gave him courage for the new challenge in front of him.", "good": "Doing what is right sometimes means standing up when everyone else stays seated. We don’t have to be the strongest. We can trust that the battle is the Lord’s, and do our part faithfully.", "carry": "Remember one time God carried you through. Let it give you courage now.", "prayer": "Lord, You were with me before. I trust that You are with me now."}, "es": {"title": "David y Goliat", "ref": "1 Samuel 17:37, 45, 47", "spoken": "Primero de Samuel, capítulo 17", "story": "El ejército de Israel estaba paralizado de miedo ante un guerrero gigante llamado Goliat. Un joven pastor, David, llegó a llevar comida a sus hermanos y oyó al gigante burlarse de Dios. Con solo una honda y cinco piedras lisas, se ofreció a enfrentarlo.", "passage": [[37, "Y añadió David: Jehová que me ha librado de las garras del león y de las garras del oso, él también me librará de la mano de este Filisteo. Y dijo Saúl á David: Ve, y Jehová sea contigo."], [45, "Entonces dijo David al Filisteo: Tú vienes á mí con espada y lanza y escudo; mas yo vengo á ti en el nombre de Jehová de los ejércitos, el Dios de los escuadrones de Israel, que tú has provocado."], [47, "Y sabrá toda esta congregación que Jehová no salva con espada y lanza; porque de Jehová es la guerra, y él os entregará en nuestras manos."]], "meaning": "La confianza de David no venía de su tamaño ni de sus armas. Venía de su memoria. Dios ya lo había librado del león y del oso. Recordar la fidelidad de Dios en el pasado le dio valor para el nuevo reto que tenía enfrente.", "good": "Hacer lo correcto a veces significa ponerse de pie cuando todos los demás se quedan sentados. No tenemos que ser los más fuertes. Podemos confiar en que la batalla es del Señor, y hacer nuestra parte con fidelidad.", "carry": "Recuerda una vez en que Dios te sostuvo. Deja que eso te dé valor hoy.", "prayer": "Señor, estuviste conmigo antes. Confío en que estás conmigo ahora."}}, {"id": "storm", "theme": "trust", "en": {"title": "Jesus Calms the Storm", "ref": "Mark 4:37–41", "spoken": "Mark, chapter 4, verses 37 through 41", "story": "One evening Jesus and His disciples set out across the Sea of Galilee. A violent storm rose, and the waves began filling the boat. Jesus was asleep, and the terrified disciples woke Him.", "passage": [[37, "And there arose a great storm of wind, and the waves beat into the ship, so that it was now full."], [38, "And he was in the hinder part of the ship, asleep on a pillow: and they awake him, and say unto him, Master, carest thou not that we perish?"], [39, "And he arose, and rebuked the wind, and said unto the sea, Peace, be still. And the wind ceased, and there was a great calm."], [40, "And he said unto them, Why are ye so fearful? how is it that ye have no faith?"], [41, "And they feared exceedingly, and said one to another, What manner of man is this, that even the wind and the sea obey him?"]], "meaning": "The disciples asked, Don’t You care that we are dying? Jesus answered with three words to the sea: Peace, be still. And the storm obeyed. Jesus was in the boat the whole time. His rest was not neglect. It was complete confidence in His Father.", "good": "Fear often pushes us to act selfishly or harshly. Trust frees us to stay kind, even in hard seasons. When we know God is in the boat with us, we can answer others with calm instead of panic.", "carry": "Whatever storm you face today, you are not in the boat alone.", "prayer": "Jesus, speak peace to the storms in my life, and to my heart."}, "es": {"title": "Jesús calma la tempestad", "ref": "Marcos 4:37–41", "spoken": "Marcos, capítulo 4, versículos 37 al 41", "story": "Una tarde, Jesús y sus discípulos cruzaban el mar de Galilea en una barca. Se levantó una tempestad violenta y las olas comenzaron a llenar la barca. Jesús dormía, y los discípulos, aterrados, lo despertaron.", "passage": [[37, "Y se levantó una grande tempestad de viento, y echaba las olas en el barco, de tal manera que ya se henchía."], [38, "Y él estaba en la popa, durmiendo sobre un cabezal, y le despertaron, y le dicen: ¿Maestro, no tienes cuidado que perecemos?"], [39, "Y levantándose, increpó al viento, y dijo á la mar: Calla, enmudece. Y cesó el viento, y fué hecha grande bonanza."], [40, "Y á ellos dijo: ¿Por qué estáis así amedrentados? ¿Cómo no tenéis fe?"], [41, "Y temieron con gran temor, y decían el uno al otro. ¿Quién es éste, que aun el viento y la mar le obedecen?"]], "meaning": "Los discípulos le preguntaron: ¿No te importa que perezcamos? Jesús le habló al mar: Calla, enmudece. Y la tempestad obedeció. Jesús estuvo en la barca todo el tiempo. Su descanso no era descuido, sino plena confianza en Su Padre.", "good": "El miedo muchas veces nos empuja a actuar con egoísmo o dureza. La confianza nos libera para seguir siendo amables, aun en tiempos difíciles. Cuando sabemos que Dios está en la barca con nosotros, podemos responder a los demás con calma y no con pánico.", "carry": "Sea cual sea la tormenta de hoy, no estás solo en la barca.", "prayer": "Jesús, habla paz a las tormentas de mi vida y a mi corazón."}}, {"id": "prodigal", "theme": "grace", "en": {"title": "The Son Who Came Home", "ref": "Luke 15:20–24", "spoken": "Luke, chapter 15, verses 20 through 24", "story": "A younger son demanded his inheritance, left home, and wasted everything. Hungry and ashamed, he decided to go back and beg to work as a servant. He practiced his apology the whole way home.", "passage": [[20, "And he arose, and came to his father. But when he was yet a great way off, his father saw him, and had compassion, and ran, and fell on his neck, and kissed him."], [21, "And the son said unto him, Father, I have sinned against heaven, and in thy sight, and am no more worthy to be called thy son."], [22, "But the father said to his servants, Bring forth the best robe, and put it on him; and put a ring on his hand, and shoes on his feet:"], [23, "And bring hither the fatted calf, and kill it; and let us eat, and be merry:"], [24, "For this my son was dead, and is alive again; he was lost, and is found. And they began to be merry."]], "meaning": "The father had been watching the road. He saw his son from far away and ran to him, before the apology was even finished. This is how Jesus describes God: not waiting with arms crossed, but running with arms open.", "good": "When we understand how freely we have been forgiven, it becomes easier to forgive others. Doing good is not how we earn our way back to God. It is our response to a love that already welcomed us home.", "carry": "No matter how far you’ve wandered, the way home is open.", "prayer": "Father, thank You for running to me. Help me welcome others the same way."}, "es": {"title": "El hijo que volvió a casa", "ref": "Lucas 15:20–24", "spoken": "Lucas, capítulo 15, versículos 20 al 24", "story": "Un hijo menor pidió su herencia, se fue de casa y lo desperdició todo. Con hambre y vergüenza, decidió volver y rogar que lo recibieran como a un jornalero. Fue ensayando su disculpa todo el camino.", "passage": [[20, "Y levantándose, vino á su padre. Y como aun estuviese lejos, viólo su padre, y fué movido á misericordia, y corrió, y echóse sobre su cuello, y besóle."], [21, "Y el hijo le dijo: Padre, he pecado contra el cielo, y contra ti, y ya no soy digno de ser llamado tu hijo."], [22, "Mas el padre dijo á sus siervos: Sacad el principal vestido, y vestidle; y poned un anillo en su mano, y zapatos en sus pies."], [23, "Y traed el becerro grueso, y matadlo, y comamos, y hagamos fiesta:"], [24, "Porque este mi hijo muerto era, y ha revivido; habíase perdido, y es hallado. Y comenzaron á regocijarse."]], "meaning": "El padre había estado mirando el camino. Vio a su hijo desde lejos y corrió hacia él, antes de que terminara de disculparse. Así describe Jesús a Dios: no esperando con los brazos cruzados, sino corriendo con los brazos abiertos.", "good": "Cuando entendemos cuán libremente hemos sido perdonados, se vuelve más fácil perdonar a otros. Hacer el bien no es la forma de ganarnos el regreso a Dios. Es nuestra respuesta a un amor que ya nos recibió en casa.", "carry": "No importa cuán lejos te hayas ido, el camino a casa está abierto.", "prayer": "Padre, gracias por correr hacia mí. Ayúdame a recibir a otros de la misma manera."}}, {"id": "ruth", "theme": "faithfulness", "en": {"title": "Ruth Stays With Naomi", "ref": "Ruth 1:16–17", "spoken": "Ruth, chapter 1, verses 16 and 17", "story": "Naomi lost her husband and both her sons in a foreign land. She told her widowed daughters-in-law to go back to their own families. One of them left, but Ruth refused to leave her alone.", "passage": [[16, "And Ruth said, Intreat me not to leave thee, or to return from following after thee: for whither thou goest, I will go; and where thou lodgest, I will lodge: thy people shall be my people, and thy God my God:"], [17, "Where thou diest, will I die, and there will I be buried: the Lord do so to me, and more also, if ought but death part thee and me."]], "meaning": "Ruth chose the harder road: a foreign land, poverty, and an uncertain future, out of love for Naomi. She also chose Naomi’s God. Later, God blessed Ruth with a new family, and she became the great-grandmother of King David.", "good": "Being faithful to people in their hardest moments reflects God’s own faithfulness to us. Loyal love rarely looks dramatic at the time, but God weaves it into a much bigger story than we can see.", "carry": "Stay close to someone who is going through a hard season.", "prayer": "Lord, make me faithful to the people You have placed in my life."}, "es": {"title": "Rut se queda con Noemí", "ref": "Rut 1:16–17", "spoken": "Rut, capítulo 1, versículos 16 y 17", "story": "Noemí perdió a su esposo y a sus dos hijos en una tierra extranjera. Les dijo a sus nueras, ya viudas, que volvieran con sus familias. Una se fue, pero Rut se negó a dejarla sola.", "passage": [[16, "Y Ruth respondió: No me ruegues que te deje, y me aparte de ti: porque donde quiera que tú fueres, iré yo; y donde quiera que vivieres, viviré. Tu pueblo será mi pueblo, y tu Dios mi Dios."], [17, "Donde tú murieres, moriré yo, y allí seré sepultada: así me haga Jehová, y así me dé, que sólo la muerte hará separación entre mí y ti."]], "meaning": "Rut escogió el camino más difícil: una tierra extraña, pobreza y un futuro incierto, por amor a Noemí. También escogió al Dios de Noemí. Más adelante, Dios bendijo a Rut con una nueva familia, y ella llegó a ser bisabuela del rey David.", "good": "Ser fieles a las personas en sus momentos más duros refleja la fidelidad de Dios con nosotros. El amor leal rara vez parece gran cosa en el momento, pero Dios lo teje en una historia mucho más grande de lo que podemos ver.", "carry": "Acompaña de cerca a alguien que está pasando por un tiempo difícil.", "prayer": "Señor, hazme fiel a las personas que has puesto en mi vida."}}, {"id": "joseph", "theme": "forgiveness", "en": {"title": "Joseph Forgives His Brothers", "ref": "Genesis 50:19–21", "spoken": "Genesis, chapter 50, verses 19 through 21", "story": "Joseph’s brothers were jealous of him and sold him into slavery. Years of hardship followed, including prison for a crime he did not commit. But God raised Joseph to lead all of Egypt, and when famine came, his brothers arrived begging for food.", "passage": [[19, "And Joseph said unto them, Fear not: for am I in the place of God?"], [20, "But as for you, ye thought evil against me; but God meant it unto good, to bring to pass, as it is this day, to save much people alive."], [21, "Now therefore fear ye not: I will nourish you, and your little ones. And he comforted them, and spake kindly unto them."]], "meaning": "Joseph had the power to take revenge. Instead, he saw God’s hand in his whole story. What his brothers meant for harm, God used to save many lives. Joseph comforted the very people who had hurt him.", "good": "Forgiveness does not mean pretending the wrong never happened. It means trusting God to bring good out of it, and refusing to let bitterness decide how we treat others.", "carry": "God can bring good out of what hurt you.", "prayer": "God, help me release what others meant for harm, and trust You to make it good."}, "es": {"title": "José perdona a sus hermanos", "ref": "Génesis 50:19–21", "spoken": "Génesis, capítulo 50, versículos 19 al 21", "story": "Los hermanos de José le tenían envidia y lo vendieron como esclavo. Siguieron años de sufrimiento, incluso la cárcel por un crimen que no cometió. Pero Dios levantó a José para gobernar Egipto, y cuando llegó el hambre, sus hermanos vinieron a pedir comida.", "passage": [[19, "Y respondióles José: No temáis: ¿estoy yo en lugar de Dios?"], [20, "Vosotros pensasteis mal sobre mí, mas Dios lo encaminó á bien, para hacer lo que vemos hoy, para mantener en vida á mucho pueblo."], [21, "Ahora, pues, no tengáis miedo; yo os sustentaré á vosotros y á vuestros hijos. Así los consoló, y les habló al corazón."]], "meaning": "José tenía el poder de vengarse. En cambio, vio la mano de Dios en toda su historia. Lo que sus hermanos pensaron para mal, Dios lo usó para salvar muchas vidas. José consoló a las mismas personas que lo habían herido.", "good": "Perdonar no significa fingir que el daño no ocurrió. Significa confiar en que Dios puede sacar algo bueno de ello, y no dejar que la amargura decida cómo tratamos a los demás.", "carry": "Dios puede sacar algo bueno de lo que te hirió.", "prayer": "Dios, ayúdame a soltar lo que otros pensaron para mal, y a confiar en que Tú lo convertirás en bien."}}, {"id": "widow", "theme": "generosity", "en": {"title": "The Widow’s Two Coins", "ref": "Mark 12:41–44", "spoken": "Mark, chapter 12, verses 41 through 44", "story": "Jesus sat near the temple treasury, watching people give. Wealthy people dropped in large amounts. Then a poor widow quietly placed in two tiny coins, worth almost nothing.", "passage": [[41, "And Jesus sat over against the treasury, and beheld how the people cast money into the treasury: and many that were rich cast in much."], [42, "And there came a certain poor widow, and she threw in two mites, which make a farthing."], [43, "And he called unto him his disciples, and saith unto them, Verily I say unto you, That this poor widow hath cast more in, than all they which have cast into the treasury:"], [44, "For all they did cast in of their abundance; but she of her want did cast in all that she had, even all her living."]], "meaning": "Jesus said she gave more than all the others. God measures a gift not by its size but by the heart behind it. She gave out of trust, holding nothing back, believing God would provide for her.", "good": "No act of love is too small to matter to God. We don’t need to be rich or impressive to do good. God treasures a sincere heart, and He sees every quiet gift no one else notices.", "carry": "Your small, sincere gift is great in God’s eyes.", "prayer": "Lord, let me give with a whole heart, trusting You to care for me."}, "es": {"title": "Las dos blancas de la viuda", "ref": "Marcos 12:41–44", "spoken": "Marcos, capítulo 12, versículos 41 al 44", "story": "Jesús estaba sentado frente al arca de las ofrendas, mirando cómo daba la gente. Los ricos echaban mucho. Entonces una viuda pobre echó en silencio dos moneditas que casi no valían nada.", "passage": [[41, "Y estando sentado Jesús delante del arca de la ofrenda, miraba cómo el pueblo echaba dinero en el arca: y muchos ricos echaban mucho."], [42, "Y como vino una viuda pobre, echó dos blancas, que son un maravedí."], [43, "Entonces llamando á sus discípulos, les dice: De cierto os digo que esta viuda pobre echó más que todos los que han echado en el arca:"], [44, "Porque todos han echado de lo que les sobra; mas ésta, de su pobreza echó todo lo que tenía, todo su alimento."]], "meaning": "Jesús dijo que ella dio más que todos los demás. Dios no mide una ofrenda por su tamaño, sino por el corazón que hay detrás. Ella dio con confianza, sin guardarse nada, creyendo que Dios la sostendría.", "good": "Ningún acto de amor es demasiado pequeño para Dios. No necesitamos ser ricos ni impresionantes para hacer el bien. Dios atesora un corazón sincero, y ve cada ofrenda callada que nadie más nota.", "carry": "Tu pequeña ofrenda sincera es grande a los ojos de Dios.", "prayer": "Señor, que dé con todo el corazón, confiando en que Tú cuidas de mí."}}, {"id": "daniel", "theme": "faithfulness", "en": {"title": "Daniel in the Lions’ Den", "ref": "Daniel 6:21–23", "spoken": "Daniel, chapter 6, verses 21 through 23", "story": "Daniel served the king honestly, and jealous officials looked for a way to trap him. They persuaded the king to forbid prayer to anyone but himself. Daniel kept praying to God three times a day, as he always had, and was thrown into a den of lions.", "passage": [[21, "Then said Daniel unto the king, O king, live for ever."], [22, "My God hath sent his angel, and hath shut the lions’ mouths, that they have not hurt me: forasmuch as before him innocency was found in me; and also before thee, O king, have I done no hurt."], [23, "Then was the king exceeding glad for him, and commanded that they should take Daniel up out of the den. So Daniel was taken up out of the den, and no manner of hurt was found upon him, because he believed in his God."]], "meaning": "Daniel did not hide, and he did not fight back. He simply stayed faithful. In the morning the king rushed to the den, and Daniel answered, alive. God had shut the lions’ mouths, and Daniel was unharmed because he trusted God.", "good": "Integrity means doing what is right even when it costs us. Daniel’s steady goodness, day after day, prepared him for his moment of greatest danger. Small daily faithfulness builds a trust that holds when times are hard.", "carry": "Keep doing what’s right, even when no one rewards it.", "prayer": "God, make me faithful in small things, and steady when I am tested."}, "es": {"title": "Daniel en el foso de los leones", "ref": "Daniel 6:21–23", "spoken": "Daniel, capítulo 6, versículos 21 al 23", "story": "Daniel servía al rey con honestidad, y unos funcionarios envidiosos buscaron cómo atraparlo. Convencieron al rey de prohibir que se orara a nadie más que a él. Daniel siguió orando a Dios tres veces al día, como siempre, y fue echado al foso de los leones.", "passage": [[21, "Entonces habló Daniel con el rey: oh rey, para siempre vive."], [22, "El Dios mío envió su ángel, el cual cerró la boca de los leones, para que no me hiciesen mal: porque delante de él se halló en mí justicia: y aun delante de ti, oh rey, yo no he hecho lo que no debiese."], [23, "Entonces se alegró el rey en gran manera á causa de él, y mandó sacar á Daniel del foso: y fué Daniel sacado del foso, y ninguna lesión se halló en él, porque creyó en su Dios."]], "meaning": "Daniel no se escondió ni respondió con violencia. Simplemente siguió siendo fiel. Al amanecer, el rey corrió al foso, y Daniel le respondió, vivo. Dios había cerrado la boca de los leones, y Daniel salió ileso porque confió en su Dios.", "good": "La integridad es hacer lo correcto aunque nos cueste. La bondad constante de Daniel, día tras día, lo preparó para su momento de mayor peligro. La fidelidad en lo pequeño construye una confianza que resiste en los tiempos difíciles.", "carry": "Sigue haciendo lo correcto, aunque nadie te lo reconozca.", "prayer": "Dios, hazme fiel en lo pequeño y firme cuando sea probado."}}, {"id": "zacchaeus", "theme": "grace", "en": {"title": "Zacchaeus Climbs a Tree", "ref": "Luke 19:5–10", "spoken": "Luke, chapter 19, verses 5 through 10", "story": "Zacchaeus was a rich tax collector, disliked by everyone for cheating his own people. When Jesus came to town, Zacchaeus was too short to see over the crowd, so he climbed a sycamore tree. Jesus stopped right beneath it and called him by name.", "passage": [[5, "And when Jesus came to the place, he looked up, and saw him, and said unto him, Zaccheus, make haste, and come down; for to day I must abide at thy house."], [6, "And he made haste, and came down, and received him joyfully."], [7, "And when they saw it, they all murmured, saying, That he was gone to be guest with a man that is a sinner."], [8, "And Zaccheus stood, and said unto the Lord; Behold, Lord, the half of my goods I give to the poor; and if I have taken any thing from any man by false accusation, I restore him fourfold."], [9, "And Jesus said unto him, This day is salvation come to this house, forsomuch as he also is a son of Abraham."], [10, "For the Son of man is come to seek and to save that which was lost."]], "meaning": "Everyone expected Jesus to avoid him. Instead, Jesus chose his house for dinner. That welcome changed Zacchaeus from the inside. He gave half his wealth to the poor and paid back four times what he had taken.", "good": "It was being loved first, not being condemned, that changed Zacchaeus. When we treat people with the kindness Jesus showed, we open the door for real change. Our goodness can be the invitation someone else needs.", "carry": "Jesus knows your name, and He still wants to come to your house.", "prayer": "Jesus, thank You for seeking me. Change my heart so I can make things right."}, "es": {"title": "Zaqueo sube al árbol", "ref": "Lucas 19:5–10", "spoken": "Lucas, capítulo 19, versículos 5 al 10", "story": "Zaqueo era un rico cobrador de impuestos, despreciado por todos porque engañaba a su propio pueblo. Cuando Jesús llegó al pueblo, Zaqueo era demasiado bajo para ver por encima de la multitud, así que se subió a un árbol. Jesús se detuvo justo debajo y lo llamó por su nombre.", "passage": [[5, "Y como vino á aquel lugar Jesús, mirando, le vió, y díjole: Zaqueo, date priesa, desciende, porque hoy es necesario que pose en tu casa."], [6, "Entonces él descendió apriesa, y le recibió gozoso."], [7, "Y viendo esto, todos murmuraban, diciendo que había entrado á posar con un hombre pecador."], [8, "Entonces Zaqueo, puesto en pie, dijo al Señor: He aquí, Señor, la mitad de mis bienes doy á los pobres; y si en algo he defraudado á alguno, lo vuelvo con el cuatro tanto."], [9, "Y Jesús le dijo: Hoy ha venido la salvación á esta casa; por cuanto él también es hijo de Abraham."], [10, "Porque el Hijo del hombre vino á buscar y á salvar lo que se había perdido."]], "meaning": "Todos esperaban que Jesús lo evitara. En cambio, Jesús escogió su casa para quedarse. Esa bienvenida cambió a Zaqueo desde adentro. Dio la mitad de sus bienes a los pobres y devolvió cuatro veces lo que había quitado.", "good": "Lo que cambió a Zaqueo fue ser amado primero, no ser condenado. Cuando tratamos a las personas con la bondad que mostró Jesús, abrimos la puerta a un cambio verdadero. Nuestra bondad puede ser la invitación que alguien más necesita.", "carry": "Jesús sabe tu nombre, y todavía quiere venir a tu casa.", "prayer": "Jesús, gracias por buscarme. Cambia mi corazón para que pueda reparar el mal que he hecho."}}, {"id": "peter", "theme": "trust", "en": {"title": "Peter Walks on Water", "ref": "Matthew 14:28–31", "spoken": "Matthew, chapter 14, verses 28 through 31", "story": "In the middle of the night, the disciples saw Jesus walking toward their boat across the sea. Peter asked to come to Him, and Jesus said, Come. Peter stepped out of the boat and walked on the water.", "passage": [[28, "And Peter answered him and said, Lord, if it be thou, bid me come unto thee on the water."], [29, "And he said, Come. And when Peter was come down out of the ship, he walked on the water, to go to Jesus."], [30, "But when he saw the wind boisterous, he was afraid; and beginning to sink, he cried, saying, Lord, save me."], [31, "And immediately Jesus stretched forth his hand, and caught him, and said unto him, O thou of little faith, wherefore didst thou doubt?"]], "meaning": "When Peter looked at the wind and the waves, he began to sink. But he did the right thing: he cried out, Lord, save me. Jesus reached out immediately and caught him. Even when our faith wavers, His hand does not.", "good": "Doing good often means stepping out of the boat: saying the hard word, offering help, taking a risk for someone else. We may wobble, but Jesus is close enough to catch us.", "carry": "Keep your eyes on Jesus, not on the waves.", "prayer": "Lord, when I start to sink, catch me, and teach me to trust You more."}, "es": {"title": "Pedro camina sobre el agua", "ref": "Mateo 14:28–31", "spoken": "Mateo, capítulo 14, versículos 28 al 31", "story": "En medio de la noche, los discípulos vieron a Jesús caminando sobre el mar hacia su barca. Pedro pidió ir hacia Él, y Jesús le dijo: Ven. Pedro bajó de la barca y caminó sobre el agua.", "passage": [[28, "Entonces le respondió Pedro, y dijo: Señor, si tú eres, manda que yo vaya á ti sobre las aguas."], [29, "Y él dijo: Ven. Y descendiendo Pedro del barco, andaba sobre las aguas para ir á Jesús."], [30, "Mas viendo el viento fuerte, tuvo miedo; y comenzándose á hundir, dió voces, diciendo: Señor, sálvame."], [31, "Y luego Jesús, extendiendo la mano, trabó de él, y le dice: Oh hombre de poca fe, ¿por qué dudaste?"]], "meaning": "Cuando Pedro miró el viento y las olas, comenzó a hundirse. Pero hizo lo correcto: gritó, Señor, sálvame. Jesús extendió la mano al instante y lo sostuvo. Aun cuando nuestra fe tambalea, Su mano no falla.", "good": "Hacer el bien muchas veces es bajarse de la barca: decir la palabra difícil, ofrecer ayuda, arriesgarse por alguien. Puede que tambaleemos, pero Jesús está lo bastante cerca para sostenernos.", "carry": "Pon tus ojos en Jesús, no en las olas.", "prayer": "Señor, cuando empiece a hundirme, sostenme, y enséñame a confiar más en Ti."}}, {"id": "elijah", "theme": "trust", "en": {"title": "The Flour That Didn’t Run Out", "ref": "1 Kings 17:13–16", "spoken": "First Kings, chapter 17, verses 13 through 16", "story": "During a long drought, God sent the prophet Elijah to a poor widow. She had just enough flour and oil for one last meal for herself and her son. Elijah asked her to make him a small cake first.", "passage": [[13, "And Elijah said unto her, Fear not; go and do as thou hast said: but make me thereof a little cake first, and bring it unto me, and after make for thee and for thy son."], [14, "For thus saith the Lord God of Israel, The barrel of meal shall not waste, neither shall the cruse of oil fail, until the day that the Lord sendeth rain upon the earth."], [15, "And she went and did according to the saying of Elijah: and she, and he, and her house, did eat many days."], [16, "And the barrel of meal wasted not, neither did the cruse of oil fail, according to the word of the Lord, which he spake by Elijah."]], "meaning": "It was a hard request, but God attached a promise to it: her flour and oil would not run out. She trusted and shared, and day after day there was enough for all of them, until the rain returned.", "good": "Sharing when we have little can feel risky. This story shows that God sees our generosity and cares for those who trust Him. Kindness done in faith is never wasted.", "carry": "God can make your little last.", "prayer": "Provider, help me share even when I feel I have little."}, "es": {"title": "La harina que no se acabó", "ref": "1 Reyes 17:13–16", "spoken": "Primero de Reyes, capítulo 17, versículos 13 al 16", "story": "Durante una larga sequía, Dios envió al profeta Elías a una viuda pobre. Ella tenía apenas un poco de harina y aceite para una última comida para ella y su hijo. Elías le pidió que primero le hiciera a él un pequeño pan.", "passage": [[13, "Y Elías le dijo: No hayas temor; ve, haz como has dicho: empero hazme á mí primero de ello una pequeña torta cocida debajo de la ceniza, y tráemela; y después harás para ti y para tu hijo."], [14, "Porque Jehová Dios de Israel ha dicho así: La tinaja de la harina no escaseará, ni se disminuirá la botija del aceite, hasta aquel día que Jehová dará lluvia sobre la haz de la tierra."], [15, "Entonces ella fué, é hizo como le dijo Elías; y comió él, y ella y su casa, muchos días."], [16, "Y la tinaja de la harina no escaseó, ni menguó la botija del aceite, conforme á la palabra de Jehová que había dicho por Elías."]], "meaning": "Era un pedido difícil, pero Dios lo acompañó con una promesa: la harina y el aceite no se acabarían. Ella confió y compartió, y día tras día hubo suficiente para todos, hasta que volvió la lluvia.", "good": "Compartir cuando tenemos poco puede sentirse arriesgado. Esta historia muestra que Dios ve nuestra generosidad y cuida de quienes confían en Él. La bondad hecha con fe nunca se desperdicia.", "carry": "Dios puede hacer que lo poco te alcance.", "prayer": "Dios proveedor, ayúdame a compartir aun cuando siento que tengo poco."}}, {"id": "children", "theme": "grace", "en": {"title": "Jesus Welcomes the Children", "ref": "Mark 10:13–16", "spoken": "Mark, chapter 10, verses 13 through 16", "story": "Parents brought their little children to Jesus so He could bless them. The disciples thought Jesus was too important and too busy, and tried to send them away.", "passage": [[13, "And they brought young children to him, that he should touch them: and his disciples rebuked those that brought them."], [14, "But when Jesus saw it, he was much displeased, and said unto them, Suffer the little children to come unto me, and forbid them not: for of such is the kingdom of God."], [15, "Verily I say unto you, Whosoever shall not receive the kingdom of God as a little child, he shall not enter therein."], [16, "And he took them up in his arms, put his hands upon them, and blessed them."]], "meaning": "Jesus was displeased with the disciples, not the children. He welcomed the little ones, took them in His arms, and blessed them. He said we must receive God’s kingdom like a child: with open hands, simple trust, and nothing to prove.", "good": "Jesus made room for the ones others considered unimportant. Doing good means making room too: noticing the overlooked, welcoming the small, and treating every person as someone God treasures.", "carry": "You never have to earn a place in God’s arms.", "prayer": "Jesus, help me trust You like a child, and welcome others the way You welcome me."}, "es": {"title": "Jesús recibe a los niños", "ref": "Marcos 10:13–16", "spoken": "Marcos, capítulo 10, versículos 13 al 16", "story": "Unos padres llevaron a sus hijos pequeños a Jesús para que los bendijera. Los discípulos pensaron que Jesús era demasiado importante y estaba muy ocupado, y trataron de despedirlos.", "passage": [[13, "Y le presentaban niños para que los tocase; y los discípulos reñían á los que los presentaban."], [14, "Y viéndolo Jesús, se enojó, y les dijo: Dejad los niños venir, y no se lo estorbéis; porque de los tales es el reino de Dios."], [15, "De cierto os digo, que el que no recibiere el reino de Dios como un niño, no entrará en él."], [16, "Y tomándolos en los brazos, poniendo las manos sobre ellos, los bendecía."]], "meaning": "Jesús se molestó con los discípulos, no con los niños. Recibió a los pequeños, los tomó en sus brazos y los bendijo. Dijo que debemos recibir el reino de Dios como un niño: con las manos abiertas, con confianza sencilla y sin nada que demostrar.", "good": "Jesús hizo espacio para quienes otros consideraban poco importantes. Hacer el bien es hacer espacio también: fijarnos en los olvidados, recibir a los pequeños y tratar a cada persona como alguien a quien Dios atesora.", "carry": "Nunca tienes que ganarte un lugar en los brazos de Dios.", "prayer": "Jesús, ayúdame a confiar en Ti como un niño, y a recibir a otros como Tú me recibes."}}, {"id": "lepers", "theme": "gratitude", "en": {"title": "The One Who Came Back", "ref": "Luke 17:12–19", "spoken": "Luke, chapter 17, verses 12 through 19", "story": "On His way to Jerusalem, Jesus met ten men with leprosy, a disease that forced them to live apart from everyone. They called out to Him from a distance, begging for mercy. He sent them to the priests, and on the way, all ten were healed.", "passage": [[12, "And as he entered into a certain village, there met him ten men that were lepers, which stood afar off:"], [13, "And they lifted up their voices, and said, Jesus, Master, have mercy on us."], [14, "And when he saw them, he said unto them, Go shew yourselves unto the priests. And it came to pass, that, as they went, they were cleansed."], [15, "And one of them, when he saw that he was healed, turned back, and with a loud voice glorified God,"], [16, "And fell down on his face at his feet, giving him thanks: and he was a Samaritan."], [17, "And Jesus answering said, Were there not ten cleansed? but where are the nine?"], [18, "There are not found that returned to give glory to God, save this stranger."], [19, "And he said unto him, Arise, go thy way: thy faith hath made thee whole."]], "meaning": "All ten received the miracle, but only one turned back. He came praising God with a loud voice and fell at Jesus’ feet to thank Him. Jesus noticed. Healing reached all ten, but gratitude brought one of them close to Jesus.", "good": "Gratitude changes how we see everything. When we remember how much God has given us, kindness toward others flows naturally. A thankful heart is quicker to share, to forgive, and to notice what others need.", "carry": "Before the day ends, go back and say thank you.", "prayer": "Lord, You have done so much for me. Let me never forget to thank You."}, "es": {"title": "El que volvió a dar gracias", "ref": "Lucas 17:12–19", "spoken": "Lucas, capítulo 17, versículos 12 al 19", "story": "Camino a Jerusalén, Jesús se encontró con diez hombres enfermos de lepra, una enfermedad que los obligaba a vivir apartados de todos. Desde lejos le gritaron pidiendo misericordia. Él los envió a los sacerdotes, y en el camino los diez quedaron limpios.", "passage": [[12, "Y entrando en una aldea, viniéronle al encuentro diez hombres leprosos, los cuales se pararon de lejos,"], [13, "Y alzaron la voz, diciendo: Jesús, Maestro, ten misericordia de nosotros."], [14, "Y como él los vió, les dijo: Id, mostraos á los sacerdotes. Y aconteció, que yendo ellos, fueron limpios."], [15, "Entonces uno de ellos, como se vió que estaba limpio, volvió, glorificando á Dios á gran voz;"], [16, "Y derribóse sobre el rostro á sus pies, dándole gracias: y éste era Samaritano."], [17, "Y respondiendo Jesús, dijo: ¿No son diez los que fueron limpios? ¿Y los nueve dónde están?"], [18, "¿No hubo quien volviese y diese gloria á Dios sino este extranjero?"], [19, "Y díjole: Levántate, vete; tu fe te ha salvado."]], "meaning": "Los diez recibieron el milagro, pero solo uno regresó. Volvió glorificando a Dios a gran voz y se postró a los pies de Jesús para darle gracias. Jesús lo notó. La sanidad alcanzó a los diez, pero la gratitud acercó a uno de ellos a Jesús.", "good": "La gratitud cambia la manera en que lo vemos todo. Cuando recordamos cuánto nos ha dado Dios, la bondad hacia los demás fluye con naturalidad. Un corazón agradecido comparte, perdona y nota las necesidades de otros con más facilidad.", "carry": "Antes de que termine el día, regresa y da las gracias.", "prayer": "Señor, has hecho tanto por mí. Que nunca me olvide de darte gracias."}}, {"id": "esther", "theme": "courage", "en": {"title": "Esther Speaks Up", "ref": "Esther 4:14–16", "spoken": "Esther, chapter 4, verses 14 through 16", "story": "Esther was a young Jewish woman who became queen of Persia. When a powerful official plotted to destroy her people, her cousin Mordecai urged her to speak to the king. But going to the king without being called could cost her life.", "passage": [[14, "For if thou altogether holdest thy peace at this time, then shall there enlargement and deliverance arise to the Jews from another place; but thou and thy father’s house shall be destroyed: and who knoweth whether thou art come to the kingdom for such a time as this?"], [15, "Then Esther bade them return Mordecai this answer,"], [16, "Go, gather together all the Jews that are present in Shushan, and fast ye for me, and neither eat nor drink three days, night or day: I also and my maidens will fast likewise; and so will I go in unto the king, which is not according to the law: and if I perish, I perish."]], "meaning": "Mordecai reminded Esther that her place in the palace was no accident. Perhaps she had been put there for exactly this moment. Esther asked her people to fast with her, then chose to go, saying: if I perish, I perish. Her courage saved her whole people.", "good": "God often places us where we are so we can stand up for others. Doing good can mean using our voice, our position, or our influence for someone who has none. Courage grows when we remember we are not acting alone.", "carry": "Maybe you are where you are for such a time as this.", "prayer": "God, give me courage to speak up for others when it matters."}, "es": {"title": "Ester alza la voz", "ref": "Ester 4:14–16", "spoken": "Ester, capítulo 4, versículos 14 al 16", "story": "Ester era una joven judía que llegó a ser reina de Persia. Cuando un funcionario poderoso tramó destruir a su pueblo, su primo Mardoqueo le pidió que hablara con el rey. Pero presentarse ante el rey sin ser llamada podía costarle la vida.", "passage": [[14, "Porque si absolutamente callares en este tiempo, respiro y libertación tendrán los Judíos de otra parte; mas tú y la casa de tu padre pereceréis. ¿Y quién sabe si para esta hora te han hecho llegar al reino?"], [15, "Y Esther dijo que respondiesen á Mardochêo:"], [16, "Ve, y junta á todos los Judíos que se hallan en Susán, y ayunad por mí, y no comáis ni bebáis en tres días, noche ni día: yo también con mis doncellas ayunaré igualmente, y así entraré al rey, aunque no sea conforme á la ley; y si perezco, que perezca."]], "meaning": "Mardoqueo le recordó a Ester que su lugar en el palacio no era casualidad. Tal vez había llegado allí justamente para ese momento. Ester pidió a su pueblo que ayunara con ella, y luego decidió ir, diciendo: si perezco, que perezca. Su valentía salvó a todo su pueblo.", "good": "Muchas veces Dios nos pone donde estamos para que defendamos a otros. Hacer el bien puede significar usar nuestra voz, nuestra posición o nuestra influencia a favor de quien no tiene ninguna. El valor crece cuando recordamos que no actuamos solos.", "carry": "Quizás estás donde estás para un momento como este.", "prayer": "Dios, dame valor para alzar la voz por otros cuando importa."}}, {"id": "sheep", "theme": "grace", "en": {"title": "The Lost Sheep", "ref": "Luke 15:4–7", "spoken": "Luke, chapter 15, verses 4 through 7", "story": "Religious leaders complained that Jesus welcomed sinners and even ate with them. So He told them a story about a shepherd with a hundred sheep who lost just one.", "passage": [[4, "What man of you, having an hundred sheep, if he lose one of them, doth not leave the ninety and nine in the wilderness, and go after that which is lost, until he find it?"], [5, "And when he hath found it, he layeth it on his shoulders, rejoicing."], [6, "And when he cometh home, he calleth together his friends and neighbours, saying unto them, Rejoice with me; for I have found my sheep which was lost."], [7, "I say unto you, that likewise joy shall be in heaven over one sinner that repenteth, more than over ninety and nine just persons, which need no repentance."]], "meaning": "The shepherd could have said that ninety-nine was good enough. Instead, he leaves them to search until he finds the one that wandered off. Then he carries it home on his shoulders, rejoicing. Jesus says heaven celebrates the same way over one person who comes back to God.", "good": "If God goes after each one, then no one is too small or too far gone to matter. That changes how we treat people others have given up on. Doing good means searching for the one, not just caring for the crowd.", "carry": "You are the one God would leave everything to find.", "prayer": "Good Shepherd, thank You for finding me. Help me go after those who are lost."}, "es": {"title": "La oveja perdida", "ref": "Lucas 15:4–7", "spoken": "Lucas, capítulo 15, versículos 4 al 7", "story": "Algunos líderes religiosos se quejaban de que Jesús recibía a los pecadores y hasta comía con ellos. Entonces les contó la historia de un pastor que tenía cien ovejas y perdió solo una.", "passage": [[4, "¿Qué hombre de vosotros, teniendo cien ovejas, si perdiere una de ellas, no deja las noventa y nueve en el desierto, y va á la que se perdió, hasta que la halle?"], [5, "Y hallada, la pone sobre sus hombros gozoso;"], [6, "Y viniendo á casa, junta á los amigos y á los vecinos, diciéndoles: Dadme el parabién, porque he hallado mi oveja que se había perdido."], [7, "Os digo, que así habrá más gozo en el cielo de un pecador que se arrepiente, que de noventa y nueve justos, que no necesitan arrepentimiento."]], "meaning": "El pastor pudo haber dicho que noventa y nueve eran suficientes. En cambio, las deja para buscar hasta encontrar a la que se había perdido. Luego la carga sobre sus hombros, gozoso, de regreso a casa. Jesús dice que en el cielo hay la misma alegría por una persona que vuelve a Dios.", "good": "Si Dios va tras cada uno, entonces nadie es demasiado pequeño ni está demasiado lejos para importar. Eso cambia la forma en que tratamos a quienes otros ya dieron por perdidos. Hacer el bien es buscar a uno, no solo cuidar a la multitud.", "carry": "Tú eres esa oveja por la que Dios lo dejaría todo.", "prayer": "Buen Pastor, gracias por encontrarme. Ayúdame a buscar a los que están perdidos."}}, {"id": "hannah", "theme": "hope", "en": {"title": "Hannah’s Prayer", "ref": "1 Samuel 1:10–11, 27–28", "spoken": "First Samuel, chapter 1", "story": "Hannah longed for a child for many years, and a rival mocked her for it. One year at the house of the Lord, she was so heartbroken she could not eat. She went and poured out her heart to God.", "passage": [[10, "And she was in bitterness of soul, and prayed unto the Lord, and wept sore."], [11, "And she vowed a vow, and said, O Lord of hosts, if thou wilt indeed look on the affliction of thine handmaid, and remember me, and not forget thine handmaid, but wilt give unto thine handmaid a man child, then I will give him unto the Lord all the days of his life, and there shall no razor come upon his head."], [27, "For this child I prayed; and the Lord hath given me my petition which I asked of him:"], [28, "Therefore also I have lent him to the Lord; as long as he liveth he shall be lent to the Lord. And he worshipped the Lord there."]], "meaning": "Hannah did not hide her pain from God. She wept and prayed honestly, and she promised to give her child back to God’s service. God heard her. She had a son, Samuel, who grew up to become a great prophet, and she kept her promise with joy.", "good": "God is not bothered by our tears. He invites them. Bringing our pain to Him, instead of taking it out on others, keeps our hearts soft. And like Hannah, we can offer back to God the good gifts He gives us.", "carry": "Pour out your heart to God. He is listening.", "prayer": "Lord, You know what I long for. I place it in Your hands."}, "es": {"title": "La oración de Ana", "ref": "1 Samuel 1:10–11, 27–28", "spoken": "Primero de Samuel, capítulo 1", "story": "Ana deseó un hijo durante muchos años, y una rival se burlaba de ella por eso. Un año, en la casa del Señor, estaba tan dolida que no podía comer. Fue y derramó su corazón delante de Dios.", "passage": [[10, "Ella con amargura de alma oró á Jehová, y lloró abundantemente."], [11, "E hizo voto, diciendo: Jehová de los ejércitos, si te dignares mirar la aflicción de tu sierva, y te acordares de mí, y no te olvidares de tu sierva, mas dieres á tu sierva un hijo varón, yo lo dedicaré á Jehová todos los días de su vida, y no subirá navaja sobre su cabeza."], [27, "Por este niño oraba, y Jehová me dió lo que le pedí."], [28, "Yo pues le vuelvo también á Jehová: todos los días que viviere, será de Jehová. Y adoró allí á Jehová."]], "meaning": "Ana no le ocultó su dolor a Dios. Lloró y oró con sinceridad, y prometió dedicar a su hijo al servicio de Dios. Dios la escuchó. Tuvo un hijo, Samuel, que llegó a ser un gran profeta, y ella cumplió su promesa con alegría.", "good": "A Dios no le molestan nuestras lágrimas. Nos invita a traerlas. Llevarle nuestro dolor, en lugar de descargarlo en otros, mantiene nuestro corazón sensible. Y como Ana, podemos ofrecerle a Dios los buenos regalos que Él nos da.", "carry": "Derrama tu corazón delante de Dios. Él te escucha.", "prayer": "Señor, Tú sabes lo que anhelo. Lo pongo en Tus manos."}}, {"id": "noah", "theme": "hope", "en": {"title": "The Rainbow Promise", "ref": "Genesis 9:13–15", "spoken": "Genesis, chapter 9, verses 13 through 15", "story": "After the great flood, Noah and his family stepped out of the ark onto a washed, empty world. Everything they had known was gone. Then God made them a promise and set a sign of it in the clouds.", "passage": [[13, "I do set my bow in the cloud, and it shall be for a token of a covenant between me and the earth."], [14, "And it shall come to pass, when I bring a cloud over the earth, that the bow shall be seen in the cloud:"], [15, "And I will remember my covenant, which is between me and you and every living creature of all flesh; and the waters shall no more become a flood to destroy all flesh."]], "meaning": "God promised never again to destroy the earth with a flood. The rainbow would be a reminder, not only for people, but for God Himself: when I see it, I will remember. Our hope rests not on how strong we are, but on how faithful He is.", "good": "God keeps His promises, so we can be people who keep ours. When we are true to our word and gentle after hard seasons, we reflect His character. Every rainbow is an invitation to trust and to begin again.", "carry": "After every storm, God’s promise still stands.", "prayer": "Faithful God, thank You for keeping Your promises. Help me keep mine."}, "es": {"title": "La promesa del arcoíris", "ref": "Génesis 9:13–15", "spoken": "Génesis, capítulo 9, versículos 13 al 15", "story": "Después del gran diluvio, Noé y su familia salieron del arca a un mundo lavado y vacío. Todo lo que conocían había desaparecido. Entonces Dios les hizo una promesa y puso una señal de ella en las nubes.", "passage": [[13, "Mi arco pondré en las nubes, el cual será por señal de convenio entre mí y la tierra."], [14, "Y será que cuando haré venir nubes sobre la tierra, se dejará ver entonces mi arco en las nubes."], [15, "Y acordarme he del pacto mío, que hay entre mí y vosotros y toda alma viviente de toda carne; y no serán más las aguas por diluvio para destruir toda carne."]], "meaning": "Dios prometió que nunca más destruiría la tierra con un diluvio. El arco en las nubes sería un recordatorio, no solo para las personas, sino para Dios mismo: cuando lo vea, me acordaré. Nuestra esperanza no descansa en cuán fuertes somos, sino en cuán fiel es Él.", "good": "Dios cumple Sus promesas, y así podemos ser personas que cumplen las suyas. Cuando somos fieles a nuestra palabra y amables después de tiempos difíciles, reflejamos Su carácter. Cada arcoíris es una invitación a confiar y a empezar de nuevo.", "carry": "Después de cada tormenta, la promesa de Dios sigue en pie.", "prayer": "Dios fiel, gracias por cumplir Tus promesas. Ayúdame a cumplir las mías."}}, {"id": "redsea", "theme": "trust", "en": {"title": "Crossing the Red Sea", "ref": "Exodus 14:13–14, 21–22", "spoken": "Exodus, chapter 14", "story": "God had just freed the Israelites from slavery in Egypt. Soon they were trapped, with the sea in front of them and Pharaoh’s army charging from behind. The people panicked and cried out to Moses.", "passage": [[13, "And Moses said unto the people, Fear ye not, stand still, and see the salvation of the Lord, which he will shew to you to day: for the Egyptians whom ye have seen to day, ye shall see them again no more for ever."], [14, "The Lord shall fight for you, and ye shall hold your peace."], [21, "And Moses stretched out his hand over the sea; and the Lord caused the sea to go back by a strong east wind all that night, and made the sea dry land, and the waters were divided."], [22, "And the children of Israel went into the midst of the sea upon the dry ground: and the waters were a wall unto them on their right hand, and on their left."]], "meaning": "Moses told them: Fear not, stand still, and see what the Lord will do. God sent a strong wind all night, and the sea opened into dry ground. Sometimes our part is simply to stay calm and let God fight for us, then walk forward when He opens the way.", "good": "When we trust God with what we cannot control, we are free to act with peace instead of fear. Panic makes us harsh. Trust makes us patient. God knows how to make a way where there seems to be none.", "carry": "The Lord will fight for you. You can be still.", "prayer": "Lord, when I feel trapped, open a way, and give me peace while I wait."}, "es": {"title": "El paso del mar Rojo", "ref": "Éxodo 14:13–14, 21–22", "spoken": "Éxodo, capítulo 14", "story": "Dios acababa de liberar a los israelitas de la esclavitud en Egipto. Pronto quedaron atrapados, con el mar delante y el ejército del faraón persiguiéndolos por detrás. El pueblo entró en pánico y clamó a Moisés.", "passage": [[13, "Y Moisés dijo al pueblo: No temáis; estáos quedos, y ved la salud de Jehová, que él hará hoy con vosotros; porque los Egipcios que hoy habéis visto, nunca más para siempre los veréis."], [14, "Jehová peleará por vosotros, y vosotros estaréis quedos."], [21, "Y extendió Moisés su mano sobre la mar, é hizo Jehová que la mar se retirase por recio viento oriental toda aquella noche; y tornó la mar en seco, y las aguas quedaron divididas."], [22, "Entonces los hijos de Israel entraron por medio de la mar en seco, teniendo las aguas como muro á su diestra y á su siniestra:"]], "meaning": "Moisés les dijo: No temáis, estaos quedos, y ved lo que hará el Señor. Dios envió un fuerte viento toda la noche, y el mar se abrió en tierra seca. A veces nuestra parte es simplemente mantener la calma y dejar que Dios pelee por nosotros, y luego avanzar cuando Él abre el camino.", "good": "Cuando confiamos a Dios lo que no podemos controlar, quedamos libres para actuar con paz y no con miedo. El pánico nos vuelve duros. La confianza nos vuelve pacientes. Dios sabe abrir camino donde parece que no lo hay.", "carry": "El Señor peleará por ti. Tú puedes estar en calma.", "prayer": "Señor, cuando me sienta atrapado, abre un camino, y dame paz mientras espero."}}, {"id": "feet", "theme": "kindness", "en": {"title": "Jesus Washes Their Feet", "ref": "John 13:4–5, 14–15", "spoken": "John, chapter 13", "story": "On the night before He died, Jesus shared a meal with His disciples. In those days, the lowest servant washed the guests’ dusty feet. No one offered, so Jesus got up, wrapped a towel around Himself, and began washing their feet.", "passage": [[4, "He riseth from supper, and laid aside his garments; and took a towel, and girded himself."], [5, "After that he poureth water into a bason, and began to wash the disciples’ feet, and to wipe them with the towel wherewith he was girded."], [14, "If I then, your Lord and Master, have washed your feet; ye also ought to wash one another’s feet."], [15, "For I have given you an example, that ye should do as I have done to you."]], "meaning": "The Teacher and Lord took the servant’s place. He even washed the feet of Judas, who would betray Him that night. Then Jesus said: I have given you an example, that you should do as I have done to you.", "good": "Real greatness in God’s eyes looks like serving. No task is beneath us when it is done in love. When we serve the people around us, especially in humble, unseen ways, we are doing exactly what Jesus did.", "carry": "Look for a humble way to serve someone today.", "prayer": "Jesus, You served me first. Give me a humble heart that loves to serve."}, "es": {"title": "Jesús lava los pies", "ref": "Juan 13:4–5, 14–15", "spoken": "Juan, capítulo 13", "story": "La noche antes de morir, Jesús compartió una cena con sus discípulos. En esos días, el sirviente más humilde lavaba los pies polvorientos de los invitados. Nadie se ofreció, así que Jesús se levantó, se ciñó una toalla y comenzó a lavarles los pies.", "passage": [[4, "Levántase de la cena, y quítase su ropa, y tomando una toalla, ciñóse."], [5, "Luego puso agua en un lebrillo, y comenzó á lavar los pies de los discípulos, y á limpiarlos con la toalla con que estaba ceñido."], [14, "Pues si yo, el Señor y el Maestro, he lavado vuestros pies, vosotros también debéis lavar los pies los unos á los otros."], [15, "Porque ejemplo os he dado, para que como yo os he hecho, vosotros también hagáis."]], "meaning": "El Maestro y Señor tomó el lugar del sirviente. Incluso lavó los pies de Judas, quien lo traicionaría esa misma noche. Luego Jesús dijo: ejemplo os he dado, para que como yo os he hecho, vosotros también hagáis.", "good": "La verdadera grandeza, a los ojos de Dios, se parece al servicio. Ninguna tarea es poca cosa cuando se hace con amor. Cuando servimos a quienes nos rodean, sobre todo de maneras humildes y ocultas, hacemos exactamente lo que hizo Jesús.", "carry": "Busca hoy una manera humilde de servir a alguien.", "prayer": "Jesús, Tú me serviste primero. Dame un corazón humilde que ame servir."}}, {"id": "midnight", "theme": "gratitude", "en": {"title": "Songs at Midnight", "ref": "Acts 16:25–26, 33–34", "spoken": "Acts, chapter 16", "story": "Paul and Silas were beaten and locked in the inner prison, their feet fastened in stocks, after helping a young woman. It was midnight, they were in pain, and they had every reason to despair.", "passage": [[25, "And at midnight Paul and Silas prayed, and sang praises unto God: and the prisoners heard them."], [26, "And suddenly there was a great earthquake, so that the foundations of the prison were shaken: and immediately all the doors were opened, and every one’s bands were loosed."], [33, "And he took them the same hour of the night, and washed their stripes; and was baptized, he and all his, straightway."], [34, "And when he had brought them into his house, he set meat before them, and rejoiced, believing in God with all his house."]], "meaning": "Instead, they prayed and sang praises to God, and the other prisoners listened. Suddenly an earthquake shook the prison, the doors opened, and everyone’s chains fell off. The jailer who had locked them up ended the night washing their wounds and believing in God with his whole family.", "good": "How we respond to hard times speaks loudly to the people watching. Praising God in the dark is not pretending everything is fine. It is trusting that He is still good, and that trust can open doors for others, not only for us.", "carry": "Even at midnight, you can still sing.", "prayer": "Lord, in my dark hours, give me a song of trust in You."}, "es": {"title": "Cánticos a medianoche", "ref": "Hechos 16:25–26, 33–34", "spoken": "Hechos, capítulo 16", "story": "Pablo y Silas fueron azotados y encerrados en el calabozo de más adentro, con los pies en el cepo, después de ayudar a una joven. Era medianoche, estaban adoloridos y tenían todas las razones para desesperarse.", "passage": [[25, "Mas á media noche, orando Pablo y Silas, cantaban himnos á Dios: y los que estaban presos los oían."], [26, "Entonces fué hecho de repente un gran terremoto, de tal manera que los cimientos de la cárcel se movían; y luego todas las puertas se abrieron, y las prisiones de todos se soltaron."], [33, "Y tomándolos en aquella misma hora de la noche, les lavó los azotes; y se bautizó luego él, y todos los suyos."], [34, "Y llevándolos á su casa, les puso la mesa: y se gozó de que con toda su casa había creído á Dios."]], "meaning": "En cambio, oraban y cantaban himnos a Dios, y los otros presos los escuchaban. De pronto, un terremoto sacudió la cárcel, las puertas se abrieron y las cadenas de todos se soltaron. El carcelero que los había encerrado terminó la noche lavándoles las heridas y creyendo en Dios con toda su familia.", "good": "La forma en que respondemos a los tiempos difíciles habla fuerte a quienes nos observan. Alabar a Dios en la oscuridad no es fingir que todo está bien. Es confiar en que Él sigue siendo bueno, y esa confianza puede abrir puertas para otros, no solo para nosotros.", "carry": "Aun a medianoche, todavía puedes cantar.", "prayer": "Señor, en mis horas oscuras, dame un canto de confianza en Ti."}}, {"id": "martha", "theme": "trust", "en": {"title": "Martha and Mary", "ref": "Luke 10:38–42", "spoken": "Luke, chapter 10, verses 38 through 42", "story": "Jesus came to visit the home of two sisters, Martha and Mary. Martha rushed around preparing everything, while Mary sat at Jesus’ feet, listening. Frustrated, Martha asked Jesus to tell her sister to help.", "passage": [[38, "Now it came to pass, as they went, that he entered into a certain village: and a certain woman named Martha received him into her house."], [39, "And she had a sister called Mary, which also sat at Jesus’ feet, and heard his word."], [40, "But Martha was cumbered about much serving, and came to him, and said, Lord, dost thou not care that my sister hath left me to serve alone? bid her therefore that she help me."], [41, "And Jesus answered and said unto her, Martha, Martha, thou art careful and troubled about many things:"], [42, "But one thing is needful: and Mary hath chosen that good part, which shall not be taken away from her."]], "meaning": "Jesus answered gently, saying her name twice. He saw how anxious and troubled she was about many things. Only one thing was truly needed, He said, and Mary had chosen it: being with Him. Martha’s service mattered, but Jesus wanted her heart more than her busyness.", "good": "Our good works flow best from time spent with God, not from worry. When we rest in His presence first, we serve others with peace instead of resentment. Time with Jesus is never wasted.", "carry": "Before you do more, sit with Jesus for a moment.", "prayer": "Lord, quiet my anxious heart. Teach me to choose the good part."}, "es": {"title": "Marta y María", "ref": "Lucas 10:38–42", "spoken": "Lucas, capítulo 10, versículos 38 al 42", "story": "Jesús llegó de visita a la casa de dos hermanas, Marta y María. Marta corría de un lado a otro preparándolo todo, mientras María se sentó a los pies de Jesús a escuchar. Frustrada, Marta le pidió a Jesús que le dijera a su hermana que la ayudara.", "passage": [[38, "Y aconteció que yendo
